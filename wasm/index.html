<!doctype html>
<!--
  Brulion — browser version (Qt for WebAssembly). Copyright the Brulion authors,
  AGPL-3.0-or-later; source: https://github.com/janusz-bit/brulion

  Custom shell based on Qt's wasm_shell.html: loading screen, download progress, error and
  exit screens, service worker registration (offline PWA), the share target's launch (handed to
  the app, or to Brulion already open in another tab). scripts/wasm-build.sh fills in the
  @BRULION_…@ placeholders. All URLs are relative, so the site works under any base path
  (GitHub Pages: /brulion/).
-->
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <!-- 1:1 mapping between CSS pixels and Qt device independent pixels (as in Qt's shell).
         The on-screen keyboard shrinks the page (interactive-widget=resizes-content): Brave's
         visualViewport is too low while its bottom toolbar hides for the keyboard
         (brave-browser#60074: the editing toolbar floated 48 px above the keyboard), the page's
         own size is right in every browser. Qt's screen (#screen) shrinks with it and the app
         lifts nothing. iOS Safari ignores it: there the app lifts its content by the part of
         #screen the visual viewport leaves out (src/platform/wasm/wasmshell.cpp,
         src/app/ui/keyboardinsets.h; docs/WEB.md "Klawiatura ekranowa"). -->
    <meta name="viewport" id="brulion-viewport"
          content="width=device-width, initial-scale=1, user-scalable=0, interactive-widget=resizes-content">
    <script>
      // ?keyboard=visual (tests, diagnosis): the browser's default instead — the keyboard shrinks
      // only the visual viewport, the page keeps its size.
      (function () {
        var visual = new URLSearchParams(location.search).get('keyboard') === 'visual';
        if (visual) {
          document.getElementById('brulion-viewport').setAttribute('content',
            'width=device-width, initial-scale=1, user-scalable=0, interactive-widget=resizes-visual');
        }
        window.brulionKeyboardMode = visual ? 'visual' : 'content';
      })();
    </script>
    <title>Brulion</title>
    <meta name="description" content="Brulion — notatki offline w Markdown: konspekt, dziennik, kalendarz, przypomnienia.">
    <meta name="application-name" content="Brulion">
    <meta name="theme-color" content="#1f2430">
    <meta name="color-scheme" content="light dark">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/logo.svg" type="image/svg+xml">
    <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="license" href="https://www.gnu.org/licenses/agpl-3.0.html">
    <style>
      :root {
        --paper: #fbf7ee;
        --ink: #1f2430;
        --muted: #5b6375;
        --accent: #e2574c;
        --track: rgba(31, 36, 48, 0.12);
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #1f2430;
          --ink: #ece6d8;
          --muted: #a7aebf;
          --track: rgba(236, 230, 216, 0.16);
        }
      }
      /* The page covers the visual viewport with no scroll bars (as in Qt's shell). */
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: var(--paper);
        color: var(--ink);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Helvetica Neue", Arial, sans-serif;
      }
      [hidden] { display: none !important; }
      /* Qt's screen: must have its final size when the app starts (QScreen geometry). */
      #screen { position: fixed; inset: 0; }
      #loader {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 24px;
        box-sizing: border-box;
        text-align: center;
        background: var(--paper);
        transition: opacity 160ms ease-out;
      }
      #loader.fading { opacity: 0; }
      #loader img { width: 112px; height: 112px; filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.18)); }
      #title { font-size: 1.2rem; font-weight: 600; letter-spacing: 0.01em; }
      #bar {
        width: min(260px, 70vw);
        height: 6px;
        border-radius: 3px;
        background: var(--track);
        overflow: hidden;
      }
      #bar > div {
        height: 100%;
        width: 0;
        border-radius: 3px;
        background: var(--accent);
        transition: width 180ms linear;
      }
      #bar.indeterminate > div { width: 30%; animation: slide 1.3s ease-in-out infinite; }
      @keyframes slide {
        from { transform: translateX(-100%); }
        to { transform: translateX(340%); }
      }
      #status { color: var(--muted); font-size: 0.92rem; min-height: 1.3em; font-variant-numeric: tabular-nums; }
      #details {
        max-width: min(36rem, 90vw);
        max-height: 30vh;
        overflow: auto;
        color: var(--muted);
        font: 0.8rem/1.4 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      #actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
      #actions button {
        font: inherit;
        font-size: 0.95rem;
        padding: 9px 18px;
        min-height: 44px;
        border-radius: 8px;
        border: 1px solid var(--track);
        background: var(--ink);
        color: var(--paper);
        cursor: pointer;
      }
      #actions button.secondary { background: transparent; color: var(--ink); }
      @media (prefers-reduced-motion: reduce) {
        #loader, #bar > div { transition: none; }
        #bar.indeterminate > div { animation: none; width: 100%; opacity: 0.5; }
      }
    </style>
  </head>
  <body>
    <div id="screen" hidden></div>
    <div id="loader" role="status" aria-live="polite">
      <img src="icons/logo.svg" alt="" width="112" height="112">
      <div id="title">Wczytywanie Brulionu…</div>
      <div id="bar" class="indeterminate" aria-hidden="true"><div></div></div>
      <div id="status"></div>
      <div id="details" hidden></div>
      <div id="actions" hidden></div>
      <noscript>Brulion potrzebuje JavaScriptu i WebAssembly — włącz JavaScript w przeglądarce.</noscript>
    </div>

    <script>
      (function () {
        'use strict';

        // Filled in by scripts/wasm-build.sh (left as "@…@" when the file is used unprocessed).
        var WASM_SIZE = parseInt('@BRULION_WASM_SIZE@', 10);
        var ASSET_VERSION = '@BRULION_ASSET_VERSION@';
        var assetQuery = ASSET_VERSION.charAt(0) === '@' ? '' : '?v=' + ASSET_VERSION;

        // Polish by default, English for English browsers (like the app's own translation).
        var english = /^en\b/i.test(navigator.language || '');
        var T = english ? {
          title: 'Loading Brulion…',
          download: 'Downloading the app…',
          start: 'Starting…',
          storage: 'Loading notes…',
          locked: 'Brulion is open in another tab. Close it to continue here.',
          ui: 'Opening…',
          failed: 'Brulion could not start.',
          noWasm: 'This browser does not support WebAssembly. Use a current Firefox, Chrome, Edge or Safari.',
          noWebgl: 'Brulion needs WebGL 2 (browser graphics). Turn on hardware acceleration or use another browser.',
          tryAnyway: 'Try anyway',
          crashed: 'Brulion stopped working. Notes saved so far are safe.',
          exited: 'Brulion has exited.',
          reload: 'Restart',
          shared: 'Sent to Brulion open in another tab.',
          sharedHint: 'You can close this tab.'
        } : {
          title: 'Wczytywanie Brulionu…',
          download: 'Pobieranie aplikacji…',
          start: 'Uruchamianie…',
          storage: 'Wczytywanie notatek…',
          locked: 'Brulion jest otwarty w innej karcie. Zamknij ją, aby kontynuować tutaj.',
          ui: 'Otwieranie…',
          failed: 'Nie udało się uruchomić Brulionu.',
          noWasm: 'Ta przeglądarka nie obsługuje WebAssembly. Użyj aktualnego Firefoksa, Chrome, Edge albo Safari.',
          noWebgl: 'Brulion potrzebuje WebGL 2 (grafiki w przeglądarce). Włącz akcelerację sprzętową albo użyj innej przeglądarki.',
          tryAnyway: 'Spróbuj mimo to',
          crashed: 'Brulion przestał działać. Zapisane notatki są bezpieczne.',
          exited: 'Brulion zakończył działanie.',
          reload: 'Uruchom ponownie',
          shared: 'Przekazano do Brulionu otwartego w innej karcie.',
          sharedHint: 'Możesz zamknąć tę kartę.'
        };
        if (english) document.documentElement.lang = 'en';

        var screen = document.getElementById('screen');
        var loader = document.getElementById('loader');
        var title = document.getElementById('title');
        var bar = document.getElementById('bar');
        var status = document.getElementById('status');
        var details = document.getElementById('details');
        var actions = document.getElementById('actions');
        title.textContent = T.title;

        function setProgress(fraction) {
          if (!(fraction >= 0)) {
            bar.classList.add('indeterminate');
            bar.firstElementChild.style.width = '';
            return;
          }
          bar.classList.remove('indeterminate');
          bar.firstElementChild.style.width = Math.min(100, fraction * 100).toFixed(1) + '%';
        }
        function setStatus(text) { status.textContent = text; }

        function showProblem(message, detailText, buttons) {
          loader.hidden = false;
          loader.classList.remove('fading');
          loader.setAttribute('role', 'alert');
          bar.hidden = true;
          title.textContent = message;
          setStatus('');
          details.textContent = detailText || '';
          details.hidden = !detailText;
          actions.textContent = '';
          (buttons || []).forEach(function (b) {
            var button = document.createElement('button');
            button.type = 'button';
            button.textContent = b.label;
            if (b.secondary) button.className = 'secondary';
            button.addEventListener('click', b.action);
            actions.appendChild(button);
          });
          actions.hidden = !buttons || buttons.length === 0;
        }
        var reloadButton = { label: T.reload, action: function () { location.reload(); } };

        // Called by the app (src/platform/wasm/wasmshell.cpp, wasmstorage.cpp).
        var loaderDone = false;
        var bridged = false;
        function hideLoader() {
          if (loaderDone) return;
          loaderDone = true;
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              loader.classList.add('fading');
              setTimeout(function () { loader.hidden = true; }, 200);
            });
          });
        }
        // ?report=/__report[/<name>]: the app's self-test results are also POSTed there (a test
        // server, scripts/web-test-server.py: browsers on the Android emulator have no DevTools).
        // Only that path of this site: resolved as fetch() resolves it (the URL parser drops tabs
        // and line breaks, so "/<tab>/host" is another site's address) and checked afterwards.
        var reportUrl = (function () {
          var path = new URLSearchParams(location.search).get('report') || '';
          if (path.charAt(0) !== '/') return '';
          try {
            var url = new URL(path, location.href);
            return url.origin === location.origin && /^\/__report(\/[\w.-]*)?$/.test(url.pathname) && !url.search
              ? url.href : '';
          } catch (e) {
            return '';
          }
        })();
        var shellBridge = {
          stage: function (name) {
            bridged = true;
            if (T[name]) setStatus(T[name]);
            setProgress(NaN);
          },
          done: hideLoader,
          // The vault's index is complete (search, links, tasks, reminders). The time
          // (performance.now()) is read by scripts/wasm-smoke.mjs and the browser benchmarks.
          indexed: function () { shellBridge.indexedAt = performance.now(); },
          // How the index was loaded: notes indexed and of them taken from the index cache
          // (IndexedDB; scripts/wasm-smoke.mjs checks that a reload uses it).
          indexStats: function (notes, fromCache) {
            shellBridge.indexedNotes = notes;
            shellBridge.indexedFromCache = fromCache;
          },
          // The index cache was written (its write-back to IndexedDB follows as for any file).
          indexCacheSaved: function () { shellBridge.indexCacheSavedAt = performance.now(); },
          // How the on-screen keyboard resizes the page: "content" or "visual" (above).
          keyboardMode: window.brulionKeyboardMode || 'content',
          // A self-test result (src/platform/wasm/wasmselftest.cpp): to the test's server.
          selftest: function (name, json) {
            if (!reportUrl || !window.fetch) return;
            var body = '{"name":' + JSON.stringify(String(name)) + ',"t":' + performance.now().toFixed(1)
              + ',"json":' + json + '}';
            fetch(reportUrl, { method: 'POST', body: body, keepalive: true, credentials: 'omit',
                               headers: { 'Content-Type': 'text/plain;charset=UTF-8' } }).catch(function () {});
          }
        };
        window.brulionShell = shellBridge;

        // Qt's hidden text field (the keyboard types into it, qwasminputcontext.cpp) sits at the
        // edited text's top-left corner: focusing it made Chrome pan the page to it (the top bar
        // out of sight) and iOS scroll the page, and below a window the keyboard shrank it scrolled
        // Qt's own containers. On touch screens it stays in the window's top-left corner, and Qt's
        // containers never stay scrolled. Qt keeps them in an open shadow root
        // (#qt-shadow-container, qwasmscreen.cpp), which a style of this document cannot reach.
        // (Chrome and Brave put their autofill bar over the keyboard for every text field; only a
        // search field avoids it, but there the keyboard capitalized the first word typed in the
        // middle of a sentence: the field stays as Qt makes it. docs/WEB.md "Klawiatura ekranowa".)
        function touchScreen() {
          return !!window.matchMedia && (matchMedia('(pointer: coarse)').matches
            || (navigator.maxTouchPoints > 0 && matchMedia('(hover: none)').matches));
        }
        function fixQtKeyboardInput() {
          var host = document.getElementById('qt-shadow-container');
          var root = host && host.shadowRoot;
          if (!root) return false;
          if (!root.getElementById('brulion-keyboard-style')) {
            var style = document.createElement('style');
            style.id = 'brulion-keyboard-style';
            if (touchScreen()) style.textContent = '.qt-window-input-element { left: 0 !important; top: 0 !important; }';
            root.appendChild(style);
            root.addEventListener('scroll', function (e) {
              var t = e.target;
              if (t && t.nodeType === 1 && (t.scrollTop || t.scrollLeft)) {
                t.scrollTop = 0;
                t.scrollLeft = 0;
              }
            }, true);
          }
          return true;
        }
        if (window.MutationObserver) {
          new MutationObserver(function (records, observer) {
            if (fixQtKeyboardInput()) observer.disconnect();
          }).observe(screen, { childList: true });
        }

        // Download progress: bytes of the uncompressed file vs. its known size, read from a copy
        // of the response body.
        function showDownloadProgress(body) {
          var reader = body.getReader();
          var loaded = 0;
          function next() {
            return reader.read().then(function (chunk) {
              if (chunk.done) {
                setProgress(1);
                setStatus(T.start);
                return undefined;
              }
              loaded += chunk.value.byteLength;
              setProgress(loaded / WASM_SIZE);
              setStatus(T.download + ' ' + Math.min(100, Math.floor(loaded * 100 / WASM_SIZE)) + '%');
              return next();
            });
          }
          next().catch(function () {});
        }
        // Downloads the .wasm. compileStreaming gets the browser's own Response: only then can the
        // browser keep the compiled code for the next visits (V8's WebAssembly code cache goes by
        // the response URL; a Response made here has none). A server that sends another type
        // than application/wasm gets a Response with that type (compileStreaming needs it; no
        // code cache then).
        function fetchWasm(url) {
          return fetch(url).then(function (response) {
            if (!response.ok) throw new Error('HTTP ' + response.status + ' ' + url);
            var type = (response.headers.get('Content-Type') || '').split(';')[0].trim().toLowerCase();
            if (type !== 'application/wasm') {
              response = new Response(response.body, { headers: { 'Content-Type': 'application/wasm' } });
            }
            if (response.body && WASM_SIZE > 0 && typeof ReadableStream !== 'undefined') {
              showDownloadProgress(response.clone().body);
            }
            return response;
          });
        }
        function compileWasm(url) {
          if (WebAssembly.compileStreaming) return WebAssembly.compileStreaming(fetchWasm(url));
          return fetchWasm(url).then(function (r) { return r.arrayBuffer(); }).then(WebAssembly.compile);
        }

        function loadScript(src) {
          return new Promise(function (resolve, reject) {
            var script = document.createElement('script');
            script.src = src;
            script.async = false;
            script.onload = resolve;
            script.onerror = function () { reject(new Error('Cannot load ' + src)); };
            document.body.appendChild(script);
          });
        }

        function hasWebGl2() {
          try {
            var canvas = document.createElement('canvas');
            return !!(window.WebGL2RenderingContext && canvas.getContext('webgl2'));
          } catch (e) {
            return false;
          }
        }

        function registerServiceWorker() {
          var params = new URLSearchParams(location.search);
          if (!('serviceWorker' in navigator) || !window.isSecureContext || params.has('nosw')) return;
          navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(function (e) {
            console.warn('Brulion: service worker not registered', e);
          });
        }

        // "Udostępnij → Brulion" in the browser version installed as an app (docs/WEB.md): the share
        // target's launch (manifest.webmanifest "share_target": GET ./?share-title=…&share-text=…
        // &share-url=…). Its parameters with a value, re-encoded ('' when none); the app reads them
        // (--share-query, src/core/notebook/share.h). They leave the address bar at once, so a
        // reload does not share again (other parameters stay).
        var SHARE_KEYS = ['share-title', 'share-text', 'share-url'];
        function takeShareQuery() {
          var params;
          try {
            params = new URLSearchParams(location.search);
          } catch (e) {
            return '';
          }
          var share = new URLSearchParams();
          var found = false;
          SHARE_KEYS.forEach(function (key) {
            if (!params.has(key)) return;
            found = true;
            var value = params.get(key);
            if (value) share.append(key, value);
            params.delete(key);
          });
          if (!found) return '';
          try {
            var rest = params.toString();
            history.replaceState(history.state, '', location.pathname + (rest ? '?' + rest : '') + location.hash);
          } catch (e) {
            // the address bar keeps them: a reload shares again
          }
          return share.toString();
        }
        var shareQuery = takeShareQuery();

        // Brulion runs in another tab of this browser — it holds the storage's Web Lock
        // "brulion-storage:…" (src/platform/wasm/wasmstorage.cpp) —: hand it the share over the
        // channel src/platform/wasm/wasmshare.cpp listens on (keep the name and the messages in
        // sync), instead of starting a second app that would wait for the lock. True once that tab
        // took it (within 4 s); false when no tab holds the lock or none answers (a frozen tab, an
        // older version): this tab starts as usual.
        var SHARE_CHANNEL = 'brulion-share:' + new URL('.', location.href).pathname;
        function forwardShare(query) {
          return new Promise(function (resolve) {
            if (typeof BroadcastChannel === 'undefined') {
              resolve(false);
              return;
            }
            var held = navigator.locks && navigator.locks.query
              ? navigator.locks.query().then(function (state) {
                return ((state && state.held) || []).some(function (lock) {
                  return typeof lock.name === 'string' && lock.name.indexOf('brulion-storage:') === 0;
                });
              }, function () { return true; })
              : Promise.resolve(true);
            held.then(function (someone) {
              if (!someone) {
                resolve(false);
                return;
              }
              var id = Date.now().toString(36) + '-' + Math.random().toString(36).slice(2);
              var channel;
              try {
                channel = new BroadcastChannel(SHARE_CHANNEL);
              } catch (e) {
                resolve(false);
                return;
              }
              var timer = 0;
              var finish = function (taken) {
                clearTimeout(timer);
                channel.close();
                resolve(taken);
              };
              timer = setTimeout(function () { finish(false); }, 4000);
              channel.onmessage = function (event) {
                var d = event.data;
                if (d && d.type === 'taken' && d.id === id) finish(true);
              };
              channel.postMessage({ type: 'share', id: id, query: query });
            });
          });
        }
        // The share went to the other tab: say so here (this tab never loads the app) and close it
        // when the browser lets a script do that (the share sheet's own window).
        function showForwarded() {
          window.brulionShareForwarded = true;
          loaderDone = true;
          bar.hidden = true;
          title.textContent = T.shared;
          setStatus(T.sharedHint);
          setTimeout(function () {
            try {
              window.close();
            } catch (e) {
              // stays open with the message
            }
          }, 1500);
        }

        function start() {
          setStatus(T.download);
          var params = new URLSearchParams(location.search);
          // Debug flows (src/platform/wasm/wasmselftest.h, src/app/diag/webselftest.h):
          // ?selftest=storage,notify,glyphs,keyboard,share,webpictures,pen
          var args = [];
          var flows = ['storage', 'notify', 'glyphs', 'keyboard', 'share', 'webpictures', 'pen'];
          (params.get('selftest') || '').split(',').forEach(function (name) {
            if (flows.indexOf(name) >= 0) args.push('--selftest-' + name);
          });
          // With ?selftest only (a shared link must never move a user's clock or route; tests/web):
          //   ?route=<view> | <route JSON>  → --route (the first route after the notebook opens)
          //   ?now=yyyy-MM-dd HH:mm         → --now (a fixed clock: the journal's day is known)
          if (params.has('selftest')) {
            var route = params.get('route');
            if (route && route.length <= 2000) args.push('--route', route);
            var now = params.get('now');
            if (now && /^\d{4}-\d{2}-\d{2} \d{2}:\d{2}$/.test(now)) args.push('--now', now);
          }
          if (shareQuery) args.push('--share-query', shareQuery);

          // Start the big download first; the small scripts load in parallel.
          var wasmModule = compileWasm('brulion.wasm' + assetQuery);
          wasmModule.catch(function () {});

          Promise.all([loadScript('qtloader.js' + assetQuery), loadScript('brulion.js' + assetQuery)])
            .then(function () {
              if (typeof qtLoad !== 'function' || typeof window.brulion_entry !== 'function') {
                throw new Error('qtloader.js / brulion.js did not load');
              }
              return qtLoad({
                arguments: args,
                qt: {
                  entryFunction: window.brulion_entry,
                  containerElements: [screen],
                  module: wasmModule,
                  onLoaded: function () {
                    // Qt sizes its screen from the container: show it now, keep the loading
                    // screen on top until the app reports its UI. Fallback for a build
                    // without the bridge: hide it after 20 s unless the app reported a stage.
                    screen.hidden = false;
                    setStatus(T.start);
                    setProgress(NaN);
                    setTimeout(function () { if (!bridged) hideLoader(); }, 20000);
                    registerServiceWorker();
                  },
                  onExit: function (exit) {
                    // The JavaScript side of the storage survives a crash: save what is in memory.
                    try {
                      if (window.brulionStorage && window.brulionStorage.flush) window.brulionStorage.flush();
                    } catch (e) {
                      console.error(e);
                    }
                    loaderDone = true;
                    var info = exit.crashed ? (exit.text || '') : (exit.code !== undefined ? 'exit code ' + exit.code : '');
                    showProblem(exit.crashed ? T.crashed : T.exited, info, [reloadButton]);
                  }
                }
              });
            })
            .catch(function (e) {
              console.error(e);
              if (!loaderDone) showProblem(T.failed, String((e && e.message) || e), [reloadButton]);
            });
        }

        function launch() {
          if (typeof WebAssembly !== 'object') {
            showProblem(T.noWasm, '', []);
          } else if (!hasWebGl2()) {
            showProblem(T.noWebgl, '', [{ label: T.tryAnyway, secondary: true, action: function () {
              actions.hidden = true;
              details.hidden = true;
              bar.hidden = false;
              loader.setAttribute('role', 'status');
              title.textContent = T.title;
              start();
            } }]);
          } else {
            start();
          }
        }

        if (shareQuery) {
          forwardShare(shareQuery).then(function (taken) {
            if (taken) showForwarded();
            else launch();
          });
        } else {
          launch();
        }
      })();
    </script>
  </body>
</html>
