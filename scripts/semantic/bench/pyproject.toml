[project]
name = "exp"
version = "0"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.7",
    "sentence-transformers>=3",
    "transformers",
    "numpy",
    "safetensors",
    "sentencepiece>=0.2.3",
    "protobuf>=7.36.2",
    "mwparserfromhell>=0.7.2",
    "pyarrow>=26.0.1",
    "pandas>=3.1.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
