// Brulion's additions to the Gradle project that androiddeployqt makes from Qt's template
// (<build>/src/app/android-build/). androiddeployqt copies android/ over the template, so this file
// lands next to Qt's own build.gradle, which stays untouched (a Qt upgrade brings its template).
// docs/ANDROID.md, "Rozmiar APK".
//
// Gradle's release builds (APK and AAB; androiddeployqt makes them for the CMake build types
// Release, RelWithDebInfo and MinSizeRel) shrink the Java/Kotlin code with R8: the Kotlin standard
// library and androidx are reduced to what is used. Qt's Java classes and Brulion's Kotlin are
// kept whole (proguard-rules.pro): C++ reaches them through JNI by name. Debug builds are not
// shrunk.
gradle.rootProject { project ->
    project.pluginManager.withPlugin('com.android.application') {
        project.android {
            buildTypes {
                release {
                    minifyEnabled = true
                    proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                        project.file('proguard-rules.pro')
                }
            }
        }
    }
}
