# Release: push a tag v<version> (scripts/release.sh commits the version on main, fast-forwards
# the release branch to that commit and tags it), or run this workflow by hand. It checks the tag
# against the version in CMakeLists.txt and nix/package.nix, creates a draft GitHub release
# (notes: .github/release-notes.md), runs the tests (ci.yml without its non-blocking performance
# smoke — a push to main runs them only with "[ci]" in a commit message, a release always; the
# Windows build runs its tests too, the AppImages only start the packed app: the Tests job covers
# Linux), builds
#   brulion-<version>-arm64-v8a.apk          Android (android.yml, signed with the release key)
#   Brulion-<version>-<arch>.AppImage(.zsync) Linux x86_64 + aarch64 (appimage.yml)
#   Brulion-<version>-windows-x86_64-setup.exe, brulion-<version>-windows-x86_64.zip
#                                            Windows, the test version (windows.yml)
#   brulion-web-<version>.html               the browser version in one file, opened from disk (wasm.yml)
#   brulion-web-<version>.zip                the browser version for any web server (wasm.yml)
#   brulion-<version>-source.tar.gz          the tagged sources (git archive)
#   brulion-clipper-<version>-chrome.zip, brulion-clipper-<version>-firefox.xpi
#                                            the Web Clipper for Chromium browsers and Firefox
#                                            (scripts/clipper-pack.sh, docs/CLIPPER.md)
#   SHA256SUMS.txt
# and publishes the release once the tests passed and every build succeeded; then GitHub Pages get
# the F-Droid repository with its APK, the download page with direct links to this release's files
# and its browser version in app/ (fdroid.yml; not for an APK signed with a throwaway key).
# Beside them, not a file of the release: the app for Google Play (android.yml with `play`), its AAB
# signed with the upload key, kept as the workflow artifact "brulion-android-play" and — once the
# release is published, when the secret PLAY_SERVICE_ACCOUNT_JSON is set — uploaded to Play's
# internal testing track (docs/GOOGLE_PLAY.md "Releases from CI"). Not for a pre-release. Its
# build never holds the release back: nothing of the release waits for it.
# A tag with a suffix (v0.2.0-rc.1) becomes a pre-release (the repository keeps the last release);
# the files carry the CMake version (0.2.0).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Tag to release, e.g. v0.2.0 (must match VERSION in CMakeLists.txt). A missing tag is
          created on the selected branch; for an existing tag select the tag itself above.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  GH_REPO: ${{ github.repository }}

jobs:
  draft:
    name: Check the version, draft the release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.release.outputs.id }}
      version: ${{ steps.version.outputs.version }}
      file-version: ${{ steps.version.outputs.file-version }}
    steps:
      - uses: actions/checkout@v7

      - id: version
        name: Check the tag against CMakeLists.txt and nix/package.nix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cmake_version=$(sed -nE 's/^[[:space:]]*VERSION[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt | head -n 1)
          nix_version=$(sed -nE 's/^[[:space:]]*version = "([^"]+)";.*/\1/p' nix/package.nix | head -n 1)
          if ! [[ $TAG =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $TAG is not v<major>.<minor>.<patch>[-<pre-release>]"
            exit 1
          fi
          if [ "${BASH_REMATCH[1]}" != "$cmake_version" ]; then
            echo "::error file=CMakeLists.txt::Tag $TAG does not match the project VERSION $cmake_version (bump it with scripts/release.sh)"
            exit 1
          fi
          if [ "$nix_version" != "$cmake_version" ]; then
            echo "::error file=nix/package.nix::nix/package.nix has version $nix_version, CMakeLists.txt $cmake_version (scripts/release.sh updates both)"
            exit 1
          fi
          # Every job builds the checked-out commit: an existing tag must point to it (a run by
          # hand for an existing tag has to be started from that tag).
          head=$(git rev-parse HEAD)
          tag_sha=$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha 2>/dev/null || true)
          if [ -n "$tag_sha" ] && [ "$tag_sha" != "$head" ]; then
            echo "::error::Tag $TAG points to $tag_sha, but this run builds $head ($GITHUB_REF). Run the workflow from the tag (Use workflow from: Tags -> $TAG)."
            exit 1
          fi
          {
            echo "version=${TAG#v}"
            echo "file-version=$cmake_version"
            echo "commit=$head"
          } >> "$GITHUB_OUTPUT"

      - id: release
        name: Create (or reuse) the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          FILE_VERSION: ${{ steps.version.outputs.file-version }}
          COMMIT: ${{ steps.version.outputs.commit }}
        run: |
          existing=$(gh api "repos/$GH_REPO/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | \"\(.id) \(.draft)\"" | head -n 1)
          if [ -n "$existing" ]; then
            read -r id draft <<< "$existing"
            if [ "$draft" != true ]; then
              echo "::error::Release $TAG is already published; delete it or release a new version"
              exit 1
            fi
            echo "Reusing the draft release $id"
          else
            prerelease=false
            case "$TAG" in *-*) prerelease=true ;; esac
            owner=${GH_REPO%%/*}
            # The F-Droid repository's landing page (fdroid.yml).
            pages_url="https://${owner,,}.github.io/${GH_REPO#*/}/"
            sed -e "s|{{VERSION}}|$VERSION|g" -e "s|{{FILE_VERSION}}|$FILE_VERSION|g" \
              -e "s|{{TAG}}|$TAG|g" -e "s|{{REPO}}|$GH_REPO|g" -e "s|{{PAGES_URL}}|$pages_url|g" \
              .github/release-notes.md > "$RUNNER_TEMP/notes.md"
            id=$(gh api -X POST "repos/$GH_REPO/releases" \
              -f tag_name="$TAG" -f target_commitish="$COMMIT" -f name="Brulion $VERSION" \
              -F body=@"$RUNNER_TEMP/notes.md" -F generate_release_notes=true \
              -F draft=true -F prerelease="$prerelease" --jq .id)
            echo "Created the draft release $id"
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  source:
    name: Source tarball and the Web Clipper
    needs: draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FILE_VERSION: ${{ needs.draft.outputs.file-version }}
    steps:
      - uses: actions/checkout@v7

      - run: |
          mkdir -p dist-source
          git archive --format=tar.gz --prefix="brulion-$FILE_VERSION/" \
            -o "dist-source/brulion-$FILE_VERSION-source.tar.gz" HEAD

      # The browser extension's packages from clipper/ with CMakeLists.txt's version (= FILE_VERSION);
      # the archives only (the script also leaves each package unpacked beside them).
      - run: |
          scripts/clipper-pack.sh --out "$RUNNER_TEMP/clipper"
          cp -- "$RUNNER_TEMP/clipper/brulion-clipper-$FILE_VERSION-chrome.zip" \
            "$RUNNER_TEMP/clipper/brulion-clipper-$FILE_VERSION-firefox.xpi" dist-source/

      - uses: actions/upload-artifact@v7
        with:
          name: brulion-source
          path: dist-source/
          if-no-files-found: error
          retention-days: 7

  # Without the non-blocking performance smoke: its result never decides a release, and a slow
  # runner that reached its job's timeout ended the run "cancelled" — the release with it (v0.6.0's
  # first run). It runs in CI by hand and with "[ci]".
  tests:
    name: Tests
    needs: draft
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      skip-perf-smoke: true

  # Without the unit tests: the Tests job above runs them on Linux (aqt's Qt with sanitizers, the
  # Nix build on x86_64 and aarch64); the AppImages still start headless once packed.
  appimage:
    name: Linux
    needs: draft
    permissions:
      contents: read
    uses: ./.github/workflows/appimage.yml
    with:
      tests: false

  windows:
    name: Windows
    needs: draft
    permissions:
      contents: read
    uses: ./.github/workflows/windows.yml

  android:
    name: Android
    needs: draft
    permissions:
      contents: read
    uses: ./.github/workflows/android.yml
    secrets: inherit

  # The app for Google Play (docs/GOOGLE_PLAY.md): the AAB for Play Console, not a file of the
  # release, so `publish` does not wait for it. Not for a pre-release (Play's tracks get releases
  # only). Signed with the upload key (PLAY_UPLOAD_KEYSTORE_*), else the release key, else a
  # throwaway key — then it is not uploaded (play-upload).
  play:
    name: Google Play
    needs: draft
    if: ${{ !contains(needs.draft.outputs.version, '-') }}
    permissions:
      contents: read
    uses: ./.github/workflows/android.yml
    with:
      play: true
    secrets: inherit

  # Without the Android emulator's check of the browsers' keyboards (skip-emulator).
  web:
    name: Web
    needs: draft
    permissions:
      contents: read
    uses: ./.github/workflows/wasm.yml
    with:
      skip-emulator: true

  publish:
    name: Publish the release
    needs: [draft, source, tests, appimage, windows, android, web]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_ID: ${{ needs.draft.outputs.release-id }}
      FILE_VERSION: ${{ needs.draft.outputs.file-version }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect the release files
        run: |
          mkdir assets
          cp -- artifacts/brulion-android-apk/* artifacts/brulion-appimage-*/* artifacts/brulion-windows/* \
            artifacts/brulion-source/* assets/
          (cd artifacts/brulion-web && zip -q -r -X "$GITHUB_WORKSPACE/assets/brulion-web-$FILE_VERSION.zip" .)
          cp -- artifacts/brulion-web-html/brulion.html "assets/brulion-web-$FILE_VERSION.html"
          # The AppImages update themselves from their .zsync files in the latest release.
          scripts/appimage-update-check.sh assets "$GH_REPO"
          (cd assets && sha256sum -- * > SHA256SUMS.txt)
          cat assets/SHA256SUMS.txt
          {
            echo "### Files of $TAG"
            echo
            echo "| File | Size |"
            echo "|---|---|"
            for f in assets/*; do echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"; done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload them to the release
        run: gh release upload "$TAG" assets/* --clobber

      - name: Warn about a throwaway signing key in the release notes
        if: needs.android.outputs.signing == 'throwaway'
        run: |
          body=$(gh api "repos/$GH_REPO/releases/$RELEASE_ID" --jq .body)
          if ! grep -q 'brulion-throwaway' <<< "$body"; then
            note=$'\n\n> [!WARNING]\n> <!-- brulion-throwaway -->This APK is signed with a throwaway key: it will not install as an update of a version signed with another key. Uninstall the app first, which deletes the data in its private storage (a notes folder on the shared storage, e.g. /storage/emulated/0/Brulion, stays).\n>\n> Ten APK jest podpisany tymczasowym kluczem: nie zainstaluje się jako aktualizacja wersji podpisanej innym kluczem. Trzeba najpierw odinstalować aplikację, co usuwa dane z jej pamięci prywatnej (folder z notatkami w pamięci współdzielonej, np. /storage/emulated/0/Brulion, zostaje).'
            gh api -X PATCH "repos/$GH_REPO/releases/$RELEASE_ID" -f body="$body$note" > /dev/null
          fi

      - name: Publish
        run: |
          url=$(gh api -X PATCH "repos/$GH_REPO/releases/$RELEASE_ID" -F draft=false --jq .html_url)
          echo "Published $url"
          echo "### Released [$TAG]($url)" >> "$GITHUB_STEP_SUMMARY"

  # The Play AAB to Google Play's internal testing track, with the version's "what's new" of
  # fastlane/metadata/android (en-US, pl as pl-PL; scripts/release.sh writes them) — only once the
  # release is published (Play keeps every versionCode it was given: an upload of a release that
  # then failed would block that version), only with a key of the repository (the first upload
  # makes its key Play's upload key), and only when the secret PLAY_SERVICE_ACCOUNT_JSON (a Google
  # Cloud service account invited in Play Console, docs/GOOGLE_PLAY.md "Releases from CI") is set:
  # without it the job only says so. The repository variable PLAY_RELEASE_STATUS is the release's
  # status, "completed" by default; "draft" while the app is a draft in Play Console (never
  # published to any track: the API refuses anything but drafts then).
  # r0adkll/upload-google-play (the Google Play Developer API's edits: upload, track, notes, commit)
  # pinned to the commit of its tag v1.1.5, as it handles the service account's key.
  play-upload:
    name: Upload to Google Play (internal testing)
    needs: [draft, play, publish]
    if: needs.play.outputs.signing == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      FILE_VERSION: ${{ needs.draft.outputs.file-version }}
      HAS_SERVICE_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - name: Is there a service account?
        if: env.HAS_SERVICE_ACCOUNT != 'true'
        run: |
          echo "::notice::No PLAY_SERVICE_ACCOUNT_JSON secret: the AAB stays in the artifact brulion-android-play (upload it in Play Console by hand)"
          echo "### Google Play: not uploaded (no PLAY_SERVICE_ACCOUNT_JSON secret); the AAB is in the artifact brulion-android-play" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v7
        if: env.HAS_SERVICE_ACCOUNT == 'true'
        with:
          sparse-checkout: fastlane

      - uses: actions/download-artifact@v8
        if: env.HAS_SERVICE_ACCOUNT == 'true'
        with:
          name: brulion-android-play
          path: play

      # Play's "what's new" per language: whatsnew-<BCP 47 tag> files; Play lists Polish as pl-PL.
      - id: notes
        name: The release notes from fastlane/metadata/android
        if: env.HAS_SERVICE_ACCOUNT == 'true'
        run: |
          IFS=. read -r major minor patch <<< "$FILE_VERSION"
          code=$((10#$major * 1000000 + 10#$minor * 1000 + 10#$patch))
          mkdir -p whatsnew
          for pair in en-US:en-US pl:pl-PL; do
            from=fastlane/metadata/android/${pair%%:*}/changelogs/$code.txt
            if [ ! -s "$from" ]; then
              echo "::error file=$from::missing: the changelog of $FILE_VERSION (scripts/release.sh writes it)"
              exit 1
            fi
            cp -- "$from" "whatsnew/whatsnew-${pair#*:}"
          done
          aab=$(find play -name "brulion-$FILE_VERSION-*-play.aab" | head -n 1)
          [ -n "$aab" ] || { echo "::error::no brulion-$FILE_VERSION-*-play.aab in the artifact"; exit 1; }
          echo "aab=$aab" >> "$GITHUB_OUTPUT"
          ls -l whatsnew "$aab"

      - name: Upload to the internal testing track
        if: env.HAS_SERVICE_ACCOUNT == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.github.januszbit.brulion.play
          releaseFiles: ${{ steps.notes.outputs.aab }}
          releaseName: ${{ needs.draft.outputs.version }}
          tracks: internal
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
          whatsNewDirectory: whatsnew

      - name: Summary
        if: env.HAS_SERVICE_ACCOUNT == 'true'
        env:
          STATUS: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
        run: |
          echo "### Google Play: $TAG uploaded to the internal testing track (status $STATUS)" >> "$GITHUB_STEP_SUMMARY"

  # The F-Droid repository on GitHub Pages, with the APK and the browser version (app/) of this
  # release (fdroid.yml): from a tag only (the github-pages environment admits main and the tags v*),
  # not for a pre-release (the repository stays at the last release), and not for an APK signed with
  # a throwaway key (it would not update the installed app).
  fdroid:
    name: F-Droid repository
    needs: [android, publish]
    if: github.ref_type == 'tag' && !contains(github.ref_name, '-') && needs.android.outputs.signing == 'release'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/fdroid.yml
    with:
      release: true
    secrets: inherit
