# Release: push a tag v<version> (scripts/release.sh does the bump + tag), or run it by hand.
# Creates a draft GitHub release, attaches Linux bundles (x86_64 + aarch64), the Android APK
# and a static web build, then publishes the release once every job has succeeded.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release, e.g. v0.2.0 (must match package.json; created from the selected branch if missing)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  GH_REPO: ${{ github.repository }}

jobs:
  draft:
    name: Draft release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.release.outputs.id }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - id: version
        name: Check the tag against the version files
        run: |
          version=$(jq -r .version package.json)
          cargo_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -n 1)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version (bump with scripts/release.sh)"
            exit 1
          fi
          if [ "$cargo_version" != "$version" ]; then
            echo "::error::src-tauri/Cargo.toml has version $cargo_version, package.json $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - id: release
        name: Create (or reuse) the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          existing=$(gh api "repos/$GH_REPO/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | \"\(.id) \(.draft)\"" | head -n 1)
          if [ -n "$existing" ]; then
            read -r id draft <<< "$existing"
            if [ "$draft" != true ]; then
              echo "::error::Release $TAG is already published; delete it or release a new version"
              exit 1
            fi
            echo "Reusing draft release $id"
          else
            prerelease=false
            case "$TAG" in *-*) prerelease=true ;; esac
            owner=${GH_REPO%%/*}
            pages_url="https://${owner,,}.github.io/${GH_REPO#*/}/"
            sed -e "s|{{VERSION}}|$VERSION|g" -e "s|{{REPO}}|$GH_REPO|g" \
              -e "s|{{PAGES_URL}}|$pages_url|g" .github/release-notes.md > "$RUNNER_TEMP/notes.md"
            id=$(gh api -X POST "repos/$GH_REPO/releases" \
              -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" -f name="Brulion $VERSION" \
              -F body=@"$RUNNER_TEMP/notes.md" -F generate_release_notes=true \
              -F draft=true -F prerelease="$prerelease" --jq .id)
            echo "Created draft release $id"
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux bundles (${{ matrix.arch }})
    needs: draft
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Ubuntu keeps the AppImage/deb compatible with older glibc.
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev build-essential pkg-config patchelf file xdg-utils

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          cache: npm

      - run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          releaseId: ${{ needs.draft.outputs.release-id }}
          uploadUpdaterJson: false
          retryAttempts: 1

  android:
    name: Android
    needs: draft
    permissions:
      contents: read
    uses: ./.github/workflows/android.yml
    secrets: inherit

  android-upload:
    name: Attach the APK
    needs: [draft, android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_ID: ${{ needs.draft.outputs.release-id }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: brulion-android-apk
          path: android

      - run: gh release upload "$TAG" android/* --clobber

      - name: Warn about a throwaway signing key in the release notes
        if: needs.android.outputs.signing == 'throwaway'
        run: |
          body=$(gh api "repos/$GH_REPO/releases/$RELEASE_ID" --jq .body)
          if ! grep -q 'brulion-throwaway' <<< "$body"; then
            note=$'\n\n> [!WARNING]\n> <!-- brulion-throwaway -->Ten APK jest podpisany tymczasowym kluczem: nie zainstaluje się jako aktualizacja wersji podpisanej innym kluczem. Trzeba najpierw odinstalować aplikację, co usuwa notatki z pamięci aplikacji (folder w pamięci współdzielonej, np. /storage/emulated/0/Brulion, zostaje).'
            gh api -X PATCH "repos/$GH_REPO/releases/$RELEASE_ID" -f body="$body$note" > /dev/null
          fi

  web:
    name: Web bundle
    needs: draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.draft.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          cache: npm

      - run: npm ci

      - name: Build the PWA for the root of a domain
        env:
          BRULION_BASE: /
        run: npm run build

      - run: |
          (cd dist && zip -q -r -X "../brulion-web-$VERSION.zip" .)
          gh release upload "$TAG" "brulion-web-$VERSION.zip" --clobber

  publish:
    name: Publish the release
    needs: [draft, linux, android-upload, web]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_ID: ${{ needs.draft.outputs.release-id }}
    steps:
      - name: SHA256SUMS.txt
        run: |
          mkdir assets
          gh release download "$TAG" --dir assets
          rm -f assets/SHA256SUMS.txt
          (cd assets && sha256sum -- *) | tee SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --clobber

      - name: Publish
        run: |
          url=$(gh api -X PATCH "repos/$GH_REPO/releases/$RELEASE_ID" -F draft=false --jq .html_url)
          echo "Published $url"
          echo "### Released [$TAG]($url)" >> "$GITHUB_STEP_SUMMARY"
