# Signed Android APK (artifact "brulion-android-apk") built in the Nix sandbox: `nix build
# .#brulion-android-tested` (nix/android.nix: every input pinned, Qt 6.11.2 for Android, NDK r27c,
# JDK 21, -Werror, Kotlin unit tests + Android lint; R8 and OpenSSL 3 for HTTPS) and signed with
# `nix run .#brulion-android-sign` — see docs/ANDROID.md. Runs by hand, for a push to main with
# "[ci]" in a commit message (and changes in the paths below; see the job's `if`), and from
# release.yml.
# Release signing uses the repository secrets QT_ANDROID_KEYSTORE_BASE64,
# QT_ANDROID_KEYSTORE_STORE_PASS and QT_ANDROID_KEYSTORE_ALIAS (create them with
# scripts/android-new-keystore.sh). Without them the APK is signed with a throwaway key (see the
# warning in the run summary).
name: Android

on:
  push:
    branches: [main]
    paths:
      - src/**
      - android/**
      - assets/**
      - i18n/**
      - 3rdparty/**
      - cmake/**
      - CMakeLists.txt
      - flake.lock
      - flake.nix
      - nix/android.nix
      - nix/android/**
      - .github/workflows/android.yml
  workflow_dispatch:
    inputs:
      aab:
        description: Also build an Android App Bundle (.aab)
        type: boolean
        default: false
  workflow_call:
    inputs:
      aab:
        description: Also build an Android App Bundle (.aab)
        type: boolean
        default: false
    outputs:
      version:
        description: App version of the built APK
        value: ${{ jobs.apk.outputs.version }}
      signing:
        description: '"release" (repository keystore) or "throwaway" (generated key)'
        value: ${{ jobs.apk.outputs.signing }}
      artifact:
        description: Name of the uploaded workflow artifact
        value: brulion-android-apk
    secrets:
      QT_ANDROID_KEYSTORE_BASE64:
        required: false
      QT_ANDROID_KEYSTORE_STORE_PASS:
        required: false
      QT_ANDROID_KEYSTORE_ALIAS:
        required: false

permissions:
  contents: read

# The literal prefix keeps this group distinct from the caller's when run via workflow_call;
# github.workflow is the caller's name there ("Release"), so a push to main never cancels the
# APK build of a release (and vice versa).
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

jobs:
  apk:
    name: Build APK
    if: github.event_name != 'push' || github.ref_type == 'tag' || contains(join(github.event.commits.*.message, ' '), '[ci]')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      version: ${{ steps.sign.outputs.version }}
      signing: ${{ steps.sign.outputs.signing }}
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v23

      - name: Build and check the APK (Kotlin unit tests and lint)
        run: nix build .#brulion-android-tested -L --out-link result-apk

      - name: Build the App Bundle
        if: inputs.aab
        run: nix build .#brulion-android-aab -L --out-link result-aab

      - id: sign
        name: Sign
        env:
          QT_ANDROID_KEYSTORE_BASE64: ${{ secrets.QT_ANDROID_KEYSTORE_BASE64 }}
          QT_ANDROID_KEYSTORE_STORE_PASS: ${{ secrets.QT_ANDROID_KEYSTORE_STORE_PASS }}
          QT_ANDROID_KEYSTORE_ALIAS: ${{ secrets.QT_ANDROID_KEYSTORE_ALIAS }}
        run: |
          keystore=$RUNNER_TEMP/brulion.jks
          if [ -n "$QT_ANDROID_KEYSTORE_BASE64" ]; then
            base64 -d <<< "$QT_ANDROID_KEYSTORE_BASE64" > "$keystore"
            signing=release
          else
            QT_ANDROID_KEYSTORE_ALIAS=brulion-throwaway
            QT_ANDROID_KEYSTORE_STORE_PASS=$(od -An -tx1 -N24 /dev/urandom | tr -d ' \n')
            echo "::add-mask::$QT_ANDROID_KEYSTORE_STORE_PASS"
            export QT_ANDROID_KEYSTORE_ALIAS QT_ANDROID_KEYSTORE_STORE_PASS
            nix shell --inputs-from . nixpkgs#jdk21_headless -c keytool -genkeypair -noprompt \
              -keystore "$keystore" -storetype PKCS12 -alias "$QT_ANDROID_KEYSTORE_ALIAS" \
              -storepass:env QT_ANDROID_KEYSTORE_STORE_PASS -keypass:env QT_ANDROID_KEYSTORE_STORE_PASS \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Brulion unofficial build, O=Throwaway key"
            signing=throwaway
          fi
          mkdir dist-android
          for input in result-apk/*.apk result-aab/*.aab; do
            [ -e "$input" ] || continue
            name=$(basename "$input")
            nix run .#brulion-android-sign -- "$input" --keystore "$keystore" \
              --alias "$QT_ANDROID_KEYSTORE_ALIAS" --out "dist-android/${name/-unsigned/}"
          done
          rm -f "$keystore"
          {
            echo "version=$(nix eval --raw .#brulion.version)"
            echo "signing=$signing"
          } >> "$GITHUB_OUTPUT"

      - name: Summary
        env:
          VERSION: ${{ steps.sign.outputs.version }}
          SIGNING: ${{ steps.sign.outputs.signing }}
        run: |
          openssl=$(unzip -p dist-android/*.apk 'lib/arm64-v8a/libcrypto_3.so' | LC_ALL=C grep -a -o -m 1 'OpenSSL 3\.[0-9.]* [0-9]* [A-Z][a-z]* [0-9]*' || true)
          {
            echo "### Brulion $VERSION for Android"
            echo
            echo "HTTPS: ${openssl:-OpenSSL version not found} (KDAB android_openssl, Apache-2.0)"
            echo
            echo "Lint: $(tail -n 1 result-apk/reports/lint-results-release.txt)"
            echo
            echo "| File | Size | SHA-256 |"
            echo "|---|---|---|"
            for f in dist-android/*; do
              echo "| $(basename "$f") | $(du -h "$f" | cut -f1) | \`$(sha256sum "$f" | cut -d' ' -f1)\` |"
            done
            if [ "$SIGNING" = throwaway ]; then
              echo
              echo "> [!WARNING]"
              echo "> Signed with a **throwaway key**: it will not install over (update) an APK signed"
              echo "> with the release key. Set the QT_ANDROID_KEYSTORE_* secrets (scripts/android-new-keystore.sh)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: brulion-android-apk
          path: dist-android/
          if-no-files-found: error
          retention-days: 30
