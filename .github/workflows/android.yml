# Signed Android APK (artifact "brulion-android-apk") built with scripts/android-build.sh
# (Qt 6.12.0 for Android via aqt, NDK r27c, JDK 21, Kotlin unit tests + Android lint; R8 and
# OpenSSL 3 for HTTPS, which CMake downloads from KDAB/android_openssl at the commit and SHA-256
# sums pinned in src/app/CMakeLists.txt) — see docs/ANDROID.md. Runs by hand, for a push to main
# with "[ci]" in a commit message (and changes in the paths below; see the job's `if`), and from
# release.yml.
# Release signing uses the repository secrets QT_ANDROID_KEYSTORE_BASE64,
# QT_ANDROID_KEYSTORE_STORE_PASS, QT_ANDROID_KEYSTORE_KEY_PASS and QT_ANDROID_KEYSTORE_ALIAS
# (create them with scripts/android-new-keystore.sh). Without them the APK is signed with a
# throwaway key (see the warning in the run summary).
# With the input `play`: the app for Google Play instead (BRULION_ANDROID_PLAY=1, docs/GOOGLE_PLAY.md),
# its APK and AAB in the artifact "brulion-android-play", signed with the upload key of the secrets
# PLAY_UPLOAD_KEYSTORE_BASE64, _STORE_PASS, _KEY_PASS and _ALIAS (scripts/android-new-keystore.sh
# --play) — without them with the QT_ANDROID_KEYSTORE_* key, then with a throwaway one. Google Play
# re-signs what it delivers with the app signing key it keeps (Play App Signing), so the upload key
# only has to be the one registered in Play Console.
name: Android

on:
  push:
    branches: [main]
    paths:
      - src/**
      - android/**
      - assets/**
      - i18n/**
      - 3rdparty/**
      - cmake/**
      - CMakeLists.txt
      - scripts/android-build.sh
      - .github/workflows/android.yml
  workflow_dispatch:
    inputs:
      aab:
        description: Also build an Android App Bundle (.aab)
        type: boolean
        default: false
      play:
        description: The app for Google Play (io.github.januszbit.brulion.play, APK + AAB, upload key)
        type: boolean
        default: false
  workflow_call:
    inputs:
      aab:
        description: Also build an Android App Bundle (.aab)
        type: boolean
        default: false
      play:
        description: The app for Google Play (io.github.januszbit.brulion.play, APK + AAB, upload key)
        type: boolean
        default: false
    outputs:
      version:
        description: App version of the built APK
        value: ${{ jobs.apk.outputs.version }}
      signing:
        description: '"release" (repository keystore; with `play` the upload key) or "throwaway" (generated key)'
        value: ${{ jobs.apk.outputs.signing }}
      artifact:
        description: Name of the uploaded workflow artifact (brulion-android-apk, with `play` brulion-android-play)
        value: ${{ jobs.apk.outputs.artifact }}
    secrets:
      QT_ANDROID_KEYSTORE_BASE64:
        required: false
      QT_ANDROID_KEYSTORE_STORE_PASS:
        required: false
      QT_ANDROID_KEYSTORE_KEY_PASS:
        required: false
      QT_ANDROID_KEYSTORE_ALIAS:
        required: false
      PLAY_UPLOAD_KEYSTORE_BASE64:
        required: false
      PLAY_UPLOAD_KEYSTORE_STORE_PASS:
        required: false
      PLAY_UPLOAD_KEYSTORE_KEY_PASS:
        required: false
      PLAY_UPLOAD_KEYSTORE_ALIAS:
        required: false

permissions:
  contents: read

# The literal prefix keeps this group distinct from the caller's when run via workflow_call;
# github.workflow is the caller's name there ("Release"), so a push to main never cancels the
# APK build of a release (and vice versa). The app for Google Play has a group of its own: a release
# builds both at once, and one group would hold the second until the first is done.
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}${{ inputs.play && '-play' || '' }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

env:
  # Keep in sync with scripts/android-build.sh.
  QT_VERSION: 6.12.0
  AQT_VERSION: 3.3.0
  NDK_VERSION: 27.2.12479018
  SDK_CMAKE_VERSION: 3.31.6

jobs:
  apk:
    name: ${{ inputs.play && 'Build the app for Google Play (APK + AAB)' || 'Build APK' }}
    if: github.event_name != 'push' || github.ref_type == 'tag' || contains(join(github.event.commits.*.message, ' '), '[ci]')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      version: ${{ steps.build.outputs.version }}
      signing: ${{ steps.build.outputs.signing }}
      artifact: ${{ steps.artifact.outputs.name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false

      # aqt runs through uvx (scripts/android-build.sh).
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: false

      # The runner's default NDK (ANDROID_NDK_ROOT) is a newer r27; Qt 6.12.0 is built with r27c.
      - id: sdk
        name: Android SDK paths
        run: |
          sdk=${ANDROID_SDK_ROOT:-$ANDROID_HOME}
          echo "Android SDK: $sdk"
          {
            echo "ndk=$sdk/ndk/$NDK_VERSION"
            echo "cmake=$sdk/cmake/$SDK_CMAKE_VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Cache the NDK r27c and the SDK's CMake
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.sdk.outputs.ndk }}
            ${{ steps.sdk.outputs.cmake }}
          key: android-ndk-${{ env.NDK_VERSION }}-cmake-${{ env.SDK_CMAKE_VERSION }}

      # The host Qt (moc, rcc, qmlcachegen, androiddeployqt, qsb…) is shared with wasm.yml.
      - name: Cache the host Qt
        uses: actions/cache@v6
        with:
          path: ~/.cache/brulion-qt/${{ env.QT_VERSION }}/gcc_64
          key: qt-${{ env.QT_VERSION }}-linux_gcc_64-aqt${{ env.AQT_VERSION }}-shadertools

      - name: Cache Qt for Android
        uses: actions/cache@v6
        with:
          path: ~/.cache/brulion-qt/${{ env.QT_VERSION }}/android_arm64_v8a
          key: qt-${{ env.QT_VERSION }}-android_arm64_v8a-aqt${{ env.AQT_VERSION }}-multimedia-shadertools

      - uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: on-failure

      - id: artifact
        name: Artifact name
        run: echo "name=${{ inputs.play && 'brulion-android-play' || 'brulion-android-apk' }}" >> "$GITHUB_OUTPUT"

      # The app for Google Play is signed with the upload key when its four secrets are there, all
      # of them together (never a mix of two keys' secrets), else with the release key — Play
      # accepts any key as the upload key on the first upload, and the owner may register the
      # release key as it (docs/GOOGLE_PLAY.md "Play App Signing and the upload key").
      - id: build
        name: Build, sign and check the ${{ inputs.play && 'app for Google Play' || 'APK' }} (+ OpenSSL, Kotlin unit tests and lint)
        env:
          ANDROID_NDK_ROOT: ${{ steps.sdk.outputs.ndk }}
          QT_ANDROID_KEYSTORE_BASE64: ${{ secrets.QT_ANDROID_KEYSTORE_BASE64 }}
          QT_ANDROID_KEYSTORE_STORE_PASS: ${{ secrets.QT_ANDROID_KEYSTORE_STORE_PASS }}
          QT_ANDROID_KEYSTORE_KEY_PASS: ${{ secrets.QT_ANDROID_KEYSTORE_KEY_PASS }}
          QT_ANDROID_KEYSTORE_ALIAS: ${{ secrets.QT_ANDROID_KEYSTORE_ALIAS }}
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ inputs.play && secrets.PLAY_UPLOAD_KEYSTORE_BASE64 || '' }}
          PLAY_UPLOAD_KEYSTORE_STORE_PASS: ${{ inputs.play && secrets.PLAY_UPLOAD_KEYSTORE_STORE_PASS || '' }}
          PLAY_UPLOAD_KEYSTORE_KEY_PASS: ${{ inputs.play && secrets.PLAY_UPLOAD_KEYSTORE_KEY_PASS || '' }}
          PLAY_UPLOAD_KEYSTORE_ALIAS: ${{ inputs.play && secrets.PLAY_UPLOAD_KEYSTORE_ALIAS || '' }}
          # (The app for Google Play always with its AAB: scripts/android-build.sh builds one unless told
          # BRULION_ANDROID_AAB=0, which only a test APK asks for.)
          BRULION_ANDROID_AAB: ${{ (inputs.aab || inputs.play) && '1' || '0' }}
          BRULION_ANDROID_PLAY: ${{ inputs.play && '1' || '0' }}
          BRULION_ANDROID_UNIT_TESTS: 1
          BRULION_ANDROID_LINT: 1
          BRULION_WERROR: 'ON'
        run: |
          if [ "$BRULION_ANDROID_PLAY" = 1 ] && [ -n "$PLAY_UPLOAD_KEYSTORE_BASE64" ]; then
            echo "Signing with the upload key (PLAY_UPLOAD_KEYSTORE_*)"
            export QT_ANDROID_KEYSTORE_BASE64=$PLAY_UPLOAD_KEYSTORE_BASE64 \
              QT_ANDROID_KEYSTORE_STORE_PASS=$PLAY_UPLOAD_KEYSTORE_STORE_PASS \
              QT_ANDROID_KEYSTORE_KEY_PASS=$PLAY_UPLOAD_KEYSTORE_KEY_PASS \
              QT_ANDROID_KEYSTORE_ALIAS=$PLAY_UPLOAD_KEYSTORE_ALIAS
          elif [ "$BRULION_ANDROID_PLAY" = 1 ]; then
            echo "No PLAY_UPLOAD_KEYSTORE_* secrets: signing with the release key (QT_ANDROID_KEYSTORE_*), if any"
          fi
          unset PLAY_UPLOAD_KEYSTORE_BASE64 PLAY_UPLOAD_KEYSTORE_STORE_PASS PLAY_UPLOAD_KEYSTORE_KEY_PASS PLAY_UPLOAD_KEYSTORE_ALIAS
          bash scripts/android-build.sh

      - name: Summary
        env:
          VERSION: ${{ steps.build.outputs.version }}
          SIGNING: ${{ steps.build.outputs.signing }}
          OPENSSL: ${{ steps.build.outputs.openssl }}
        run: |
          {
            echo "### Brulion $VERSION for Android${{ inputs.play && ' — the app for Google Play' || '' }}"
            echo
            echo "HTTPS: $OPENSSL (KDAB android_openssl, Apache-2.0)"
            echo
            echo "| File | Size | SHA-256 |"
            echo "|---|---|---|"
            for f in dist-android/*; do
              echo "| $(basename "$f") | $(du -h "$f" | cut -f1) | \`$(sha256sum "$f" | cut -d' ' -f1)\` |"
            done
            if [ "$SIGNING" = throwaway ]; then
              echo
              echo "> [!WARNING]"
              echo "> Signed with a **throwaway key**: it will not install over (update) an APK signed"
              echo "> with the release key. Set the QT_ANDROID_KEYSTORE_* secrets (scripts/android-new-keystore.sh)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: dist-android/
          if-no-files-found: error
          retention-days: 30

      - name: Lint report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-lint-report
          path: build-android/src/app/android-build/build/reports/
          if-no-files-found: ignore
          retention-days: 7
