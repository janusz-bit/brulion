# TEMPORARY (branch fix/selftest-timing only; removed before the branch is merged): stress runs of
# the editor playground's selection and block link self-tests in an ASan/UBSan Debug build like
# ci.yml's linux job — eight copies at a time on the four-core runner, for load like CI's full
# ctest run and more. The "diag" job applies the logging patches in .github/selftest-stress/
# (those that still apply) and keeps every log.
name: Selftest stress

on:
  push:
    branches: [fix/selftest-timing]

permissions:
  contents: read

env:
  QT_VERSION: 6.11.2

jobs:
  stress:
    name: Stress ${{ matrix.job }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        job: [a, b, c, diag]
    env:
      REGEX: ${{ matrix.job == 'diag' && '^tst_editor_qml_selection_touch$' || '^tst_editor_qml_(selection|blocklinks)(_touch)?$' }}
      ROUNDS: ${{ matrix.job == 'diag' && '2' || '3' }}
      COPIES: '8'
    steps:
      - uses: actions/checkout@v7

      - name: Logging patches (diag)
        if: matrix.job == 'diag'
        run: |
          for p in .github/selftest-stress/*.patch; do
            if git apply --check "$p"; then git apply "$p"; echo "applied $p"; else echo "skipped $p"; fi
          done

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          aqtversion: ==3.3.0
          cache: true

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          -DCMAKE_BUILD_TYPE=Debug
          -DBRULION_WERROR=ON
          "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer"
          "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"

      - name: Build the app
        run: cmake --build build --parallel --target brulion

      - name: Self-tests, ${{ env.COPIES }} copies at a time
        env:
          ASAN_OPTIONS: detect_leaks=0:strict_string_checks=1:detect_stack_use_after_return=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          # (diag: timestamps; empty elsewhere: Qt's default pattern, as in CI)
          QT_MESSAGE_PATTERN: ${{ matrix.job == 'diag' && '%{time process} %{message}' || '' }}
        run: |
          set +e
          mkdir -p out
          for r in $(seq 1 "$ROUNDS"); do
            for p in $(seq 1 "$COPIES"); do
              ( ctest --test-dir build -V -R "$REGEX" > "out/r$r-p$p.log" 2>&1; echo $? > "out/r$r-p$p.rc" ) &
            done
            wait
          done
          echo "### Runs per test" >> "$GITHUB_STEP_SUMMARY"
          for t in $(ctest --test-dir build -N -R "$REGEX" | sed -n 's/^ *Test *#[0-9]*: //p'); do
            runs=$(grep -l "Test *#[0-9]*: $t \.\.\." out/*.log | wc -l)
            failed=$(grep -h "Test *#[0-9]*: $t \.\.\." out/*.log | grep -c "Failed" || true)
            echo "$t: runs=$runs failed=$failed" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          grep -h "SELFTEST FAIL\|\*\*\*Failed\|\*\*\*Timeout\|ERROR: AddressSanitizer\|runtime error" out/*.log | sed 's/^[0-9.]* //' | sort | uniq -c | sort -rn | tee -a "$GITHUB_STEP_SUMMARY" || true
          if [ "${{ matrix.job }}" != diag ] && grep -q -v '^0$' out/*.rc; then
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: logs-${{ matrix.job }}
          path: out/
          retention-days: 7
