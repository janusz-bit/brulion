# Windows x86_64, the test version (artifact "brulion-windows": the portable ZIP and the Inno Setup
# installer) built with scripts/windows-build.ps1: Qt 6.11.2 for MSVC 2022 from aqt, a CMake +
# Ninja Release build, the unit tests and the QML self-tests offscreen, windeployqt, the packages,
# then both checked on the runner without Qt on PATH (the ZIP unpacked into a fresh folder, the
# installer installed and uninstalled silently for the current user; brulion-cli --version and the
# shell self-test of the packaged app). docs/WINDOWS.md. Runs by hand, for a push to main with
# "[ci]" in a commit message (and changes in the paths below; see the job's `if`), and from
# release.yml.
name: Windows

on:
  push:
    branches: [main]
    paths:
      - src/**
      - tests/**
      - assets/**
      - i18n/**
      - 3rdparty/**
      - cmake/**
      - CMakeLists.txt
      - packaging/windows/**
      - scripts/windows-build.ps1
      - .github/workflows/windows.yml
  workflow_dispatch:
  workflow_call:
    outputs:
      version:
        description: App version of the built packages
        value: ${{ jobs.windows.outputs.version }}

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

env:
  QT_VERSION: 6.11.2

jobs:
  windows:
    name: Windows (x86_64, MSVC 2022)
    if: github.event_name != 'push' || github.ref_type == 'tag' || contains(join(github.event.commits.*.message, ' '), '[ci]')
    runs-on: windows-2022
    timeout-minutes: 120
    outputs:
      version: ${{ steps.package.outputs.version }}
    env:
      CCACHE_DIR: ${{ github.workspace }}\.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 1500M
      CCACHE_COMPILERCHECK: content
    defaults:
      run:
        shell: pwsh
    steps:
      # The tests compare bytes and hash the guide's pages: no CRLF in the checkout (the runner's
      # Git has core.autocrlf=true; .gitattributes says the same for every clone).
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      # The essential Qt modules (qtbase, qtdeclarative, qtsvg, qttools, qttranslations) hold all
      # the CMake files find: Core, Gui, Network, Qml, Quick, QuickControls2, Svg, Widgets, Test,
      # LinguistTools, GuiPrivate (DBus is for Linux only). aqtinstall 3.3.0 (the latest release)
      # does not know the Windows repository layout of Qt 6.11 (qt6_6112_msvc2022_64/, aqtinstall
      # PR #1000, merged after 3.3.0): its master at a pinned commit until a release has it.
      # Qt PDF (`qtpdf`): the PDF pages of drawings' backdrops (src/platform/pdfpages_qtpdf.cpp).
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtpdf
          aqtversion: ==3.3.0
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7
          cache: true

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Ninja, ccache and Inno Setup
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress }
          if (-not (Get-Command ccache -ErrorAction SilentlyContinue)) { choco install ccache -y --no-progress }
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          cmake --version
          ninja --version
          ccache --version | Select-Object -First 1
          cl 2>&1 | Select-Object -First 1

      # The newest cache of an earlier run (a tag's run sees main's caches); saved again right
      # after the build, so a failing test does not lose it.
      - name: Restore the compiler cache
        uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ccache-windows-msvc-${{ env.QT_VERSION }}-${{ github.sha }}
          restore-keys: ccache-windows-msvc-${{ env.QT_VERSION }}-

      - name: Build (CMake, Ninja, Release)
        id: build
        run: |
          ccache -z
          scripts/windows-build.ps1 -Steps build
          ccache -s

      - name: Save the compiler cache
        if: ${{ !cancelled() && steps.build.outcome != 'skipped' }}
        uses: actions/cache/save@v6
        with:
          path: .ccache
          key: ccache-windows-msvc-${{ env.QT_VERSION }}-${{ github.sha }}

      # The tests' local time is Central European: on Linux they set TZ, which the Windows C
      # runtime (and Qt's local time through it) does not take in that form
      # (tests/common/centraleuropeantime.h).
      - name: Unit tests (ctest, offscreen)
        run: |
          tzutil /s "Central European Standard Time"
          scripts/windows-build.ps1 -Steps test

      - id: package
        name: Package (windeployqt, ZIP, installer)
        run: scripts/windows-build.ps1 -Steps package

      - name: Check the ZIP and the installer
        run: scripts/windows-build.ps1 -Steps check

      - name: Summary
        run: |
          $lines = @('### Brulion for Windows (test version)', '', '| File | Size | SHA-256 |', '|---|---|---|')
          foreach ($f in Get-ChildItem dist-windows) {
            $lines += "| $($f.Name) | $([math]::Round($f.Length / 1MB, 1)) MB | ``$((Get-FileHash -Algorithm SHA256 $f.FullName).Hash.ToLower())`` |"
          }
          $lines | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v7
        with:
          name: brulion-windows
          path: dist-windows/
          if-no-files-found: error
          retention-days: 14
