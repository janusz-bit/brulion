# Publishes the browser version (PWA) to GitHub Pages: https://<owner>.github.io/<repo>/
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a running deployment is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - id: pages
        uses: actions/configure-pages@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          cache: npm
      - run: npm ci
      - name: Build the PWA
        env:
          # "/brulion/" for github.io/brulion; "/" when the site has a custom domain.
          BRULION_BASE: ${{ steps.pages.outputs.base_path }}/
        run: npm run build
      # Unknown paths (e.g. a reload of a deep link) get the app instead of GitHub's 404 page.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
