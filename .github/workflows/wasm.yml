# Browser version (Qt 6.11.2 for WebAssembly, offline PWA) built with scripts/wasm-build.sh —
# see docs/WEB.md. Runs by hand and for a push to main with "[ci]" in a commit message (and
# changes in the paths below; see the build job's `if`); both deploy main to GitHub Pages
# (https://<owner>.github.io/brulion/; the site uses relative URLs, so any base path works).
# Also called by release.yml (deploy: false, pages-artifact) for the brulion-web-<version>.zip
# release asset; release.yml deploys that site to GitHub Pages once the release is published.
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions", and
# Settings -> Environments -> github-pages -> Deployment branches and tags: main and tag v*.
name: Web

on:
  push:
    branches: [main]
    paths:
      - src/**
      - wasm/**
      - assets/**
      - i18n/**
      - 3rdparty/**
      - cmake/**
      - CMakeLists.txt
      - scripts/wasm-build.sh
      - scripts/wasm-smoke.mjs
      - scripts/web-test-server.py
      - .github/workflows/wasm.yml
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to GitHub Pages (from main only)
        type: boolean
        default: true
  workflow_call:
    inputs:
      deploy:
        description: Deploy to GitHub Pages (from main only)
        type: boolean
        default: false
      pages-artifact:
        description: Upload the site as the GitHub Pages artifact for the caller to deploy
        type: boolean
        default: false
      skip-emulator:
        description: Leave out the Android emulator's browser check (release.yml)
        type: boolean
        default: false
    outputs:
      artifact:
        description: Name of the uploaded workflow artifact (the site, dist-wasm/)
        value: brulion-web

permissions:
  contents: read

concurrency:
  group: wasm-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

env:
  # Keep in sync with scripts/wasm-build.sh (Qt 6.11 requires exactly Emscripten 4.0.7).
  QT_VERSION: 6.11.2
  AQT_VERSION: 3.3.0
  EMSDK_VERSION: 4.0.7

jobs:
  build:
    name: Build and test the site
    if: github.event_name != 'push' || github.ref_type == 'tag' || contains(join(github.event.commits.*.message, ' '), '[ci]')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      deploy: ${{ steps.deploy.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7

      - id: deploy
        name: Deploy?
        env:
          DEPLOY: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.deploy) }}
        run: echo "deploy=$DEPLOY" | tee -a "$GITHUB_OUTPUT"

      # aqt runs through uvx (scripts/wasm-build.sh).
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Cache emsdk and Qt for WebAssembly
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/brulion-emsdk
            ~/.cache/brulion-qt/${{ env.QT_VERSION }}/wasm_singlethread
          key: wasm-qt-${{ env.QT_VERSION }}-emsdk-${{ env.EMSDK_VERSION }}-aqt${{ env.AQT_VERSION }}

      # The host Qt (moc, rcc, qmlcachegen, lrelease…) is shared with android.yml.
      - name: Cache the host Qt
        uses: actions/cache@v6
        with:
          path: ~/.cache/brulion-qt/${{ env.QT_VERSION }}/gcc_64
          key: qt-${{ env.QT_VERSION }}-linux_gcc_64-aqt${{ env.AQT_VERSION }}

      - name: Build (installs emsdk and Qt when not cached)
        run: |
          set -o pipefail
          scripts/wasm-build.sh --setup | tee "$RUNNER_TEMP/sizes.txt"
          {
            echo "### Brulion for the browser"
            echo
            echo '```'
            cat "$RUNNER_TEMP/sizes.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Keep the cached emsdk small: the downloaded archives are already unpacked.
          rm -rf ~/.cache/brulion-emsdk/emsdk/downloads

      # Headless Chrome (preinstalled) under the GitHub Pages path: the app starts, its emoji and
      # symbols draw (no empty boxes: the bundled fallback fonts), it follows a phone's on-screen
      # keyboard (a stubbed visualViewport; on an emulated phone the editing toolbar ends on it and
      # a page the browser shrank gets no overlap), the notes survive a reload and a browser
      # restart, a big vault gets indexed without input (and its index cache, kept in a database of
      # its own, fails alone when the quota cannot take it), and it starts offline from the service
      # worker.
      - name: Smoke test in Chrome
        run: |
          mkdir -p "$RUNNER_TEMP/site/brulion" "$RUNNER_TEMP/shots"
          cp -r dist-wasm/. "$RUNNER_TEMP/site/brulion/"
          python3 -m http.server 8123 --bind 127.0.0.1 --directory "$RUNNER_TEMP/site" > "$RUNNER_TEMP/http.log" 2>&1 &
          server=$!
          sleep 1
          export CHROME
          CHROME=$(command -v google-chrome)
          node scripts/wasm-smoke.mjs --url http://127.0.0.1:8123/brulion/ --profile "$RUNNER_TEMP/profile" \
            --loads 2 --selftest --glyphs --keyboard --expect-first 1 --screenshot "$RUNNER_TEMP/shots/online.png"
          node scripts/wasm-smoke.mjs --url http://127.0.0.1:8123/brulion/ --profile "$RUNNER_TEMP/profile-phone" \
            --keyboard-phone --screenshot "$RUNNER_TEMP/shots/phone.png"
          # A 3000-note vault must index completely without any input (Qt's WebAssembly timers).
          node scripts/wasm-smoke.mjs --url http://127.0.0.1:8123/brulion/ --profile "$RUNNER_TEMP/profile-index" \
            --loads 2 --index-notes 3000 --screenshot "$RUNNER_TEMP/shots/index.png"
          # An index cache the site's quota cannot take fails alone (its own IndexedDB database).
          node scripts/wasm-smoke.mjs --url http://127.0.0.1:8123/brulion/ --profile "$RUNNER_TEMP/profile-quota" \
            --loads 2 --index-notes 1000 --cache-quota
          kill "$server"
          wait "$server" || true
          node scripts/wasm-smoke.mjs --url http://127.0.0.1:8123/brulion/ --profile "$RUNNER_TEMP/profile" \
            --loads 1 --selftest --expect-first 3 --screenshot "$RUNNER_TEMP/shots/offline.png"

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-smoke-screenshots
          path: ${{ runner.temp }}/shots/
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: brulion-web
          path: dist-wasm/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - if: steps.deploy.outputs.deploy == 'true' || inputs.pages-artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist-wasm/
          include-hidden-files: true

  # The editing toolbar on the on-screen keyboard in real browsers — Chrome, Brave (its
  # visualViewport bug, brave-browser#60074) and Firefox — on an Android 16 emulator (KVM):
  # scripts/android-emulator-test.sh --web-keyboard, docs/WEB.md "Klawiatura ekranowa". Not for
  # releases (release.yml sets skip-emulator for every release, pre-releases too: a flaky emulator
  # must not hold one back) and not needed for the deployment.
  keyboard-android:
    name: On-screen keyboard in Android browsers (emulator)
    needs: build
    if: ${{ !inputs.skip-emulator }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: brulion-web
          path: dist-wasm

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache the browsers' APKs
        uses: actions/cache@v6
        with:
          path: ~/.cache/brulion-web-browsers
          key: web-keyboard-browsers-brave1.97.59-fenix157.0.1

      - name: Chrome, Brave and Firefox on the emulator
        env:
          BRULION_EMULATOR_OUT: ${{ runner.temp }}/web-keyboard
        run: |
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          scripts/android-emulator-test.sh --web-keyboard dist-wasm

      - name: Upload the screenshots and samples
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-keyboard
          path: ${{ runner.temp }}/web-keyboard/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    # One deployment at a time; a running deployment is allowed to finish.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6

      - id: deployment
        uses: actions/deploy-pages@v5
