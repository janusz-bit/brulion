# Linux AppImages (artifacts "brulion-appimage-x86_64" and "brulion-appimage-aarch64": the
# AppImage and its .zsync update file) built with scripts/appimage-build.sh: Qt 6.11.2 from aqt,
# Release build, unit tests, linuxdeploy + linuxdeploy-plugin-qt, a headless start of the packed
# app. Runs by hand, for a push to main with "[ci]" in a commit message (and changes in the paths
# below; see the job's `if`), and from release.yml.
# The AppImage runs where glibc is at least the build container's: Ubuntu 22.04 (glibc 2.35,
# GCC 12 — the oldest compiler Brulion is built with) for x86_64; Qt's arm64 binaries need
# glibc 2.38, so aarch64 builds on Ubuntu 24.04.
name: AppImage

on:
  push:
    branches: [main]
    paths:
      - src/**
      - tests/**
      - assets/**
      - i18n/**
      - 3rdparty/**
      - cmake/**
      - CMakeLists.txt
      - scripts/appimage-build.sh
      - .github/workflows/appimage.yml
  workflow_dispatch:
  workflow_call:
    outputs:
      version:
        description: App version of the built AppImages
        value: ${{ jobs.appimage.outputs.version }}

permissions:
  contents: read

concurrency:
  group: appimage-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

env:
  QT_VERSION: 6.11.2

jobs:
  appimage:
    name: AppImage (${{ matrix.arch }})
    if: github.event_name != 'push' || github.ref_type == 'tag' || contains(join(github.event.commits.*.message, ' '), '[ci]')
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    timeout-minutes: 60
    outputs:
      version: ${{ steps.build.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            image: ubuntu:22.04
            qt: gcc_64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            image: ubuntu:24.04
            qt: gcc_arm64
    env:
      # AppImageUpdate and desktop integrations update from the latest release's .zsync file.
      LDAI_UPDATE_INFORMATION: gh-releases-zsync|${{ github.repository_owner }}|${{ github.event.repository.name }}|latest|Brulion-*-${{ matrix.arch }}.AppImage.zsync
    steps:
      - uses: actions/checkout@v7

      - name: Install the build dependencies
        run: scripts/appimage-build.sh --install-deps

      - name: Cache Qt and linuxdeploy
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/brulion-qt/${{ env.QT_VERSION }}/${{ matrix.qt }}
            ~/.cache/brulion-linuxdeploy
          key: appimage-${{ matrix.arch }}-qt-${{ env.QT_VERSION }}-${{ hashFiles('scripts/appimage-build.sh') }}
          restore-keys: |
            appimage-${{ matrix.arch }}-qt-${{ env.QT_VERSION }}-

      - id: build
        name: Build, test and pack the AppImage
        run: scripts/appimage-build.sh

      - name: Summary
        run: |
          {
            echo "### Brulion AppImage"
            echo
            echo "| File | Size | SHA-256 |"
            echo "|---|---|---|"
            for f in dist-appimage/*; do
              echo "| $(basename "$f") | $(du -h "$f" | cut -f1) | \`$(sha256sum "$f" | cut -d' ' -f1)\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: brulion-appimage-${{ matrix.arch }}
          path: dist-appimage/
          if-no-files-found: error
          retention-days: 14
