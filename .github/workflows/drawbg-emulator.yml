# Throwaway (branch s2/drawbg-emu only, never merged): the x86_64 app and the bridge self-test APK
# built as scripts/android-build.sh does, then scripts/android-emulator-test.sh on an Android 16
# emulator with KVM — the bridge self-test's PDF page through PdfRenderer (drawbg), with the laptop
# off.
name: drawbg emulator
on:
  push:
    branches: [s2/drawbg-emu]
permissions:
  contents: read
env:
  QT_VERSION: 6.11.2
  AQT_VERSION: 3.3.0
  NDK_VERSION: 27.2.12479018
  SDK_CMAKE_VERSION: 3.31.6
jobs:
  selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: false
      - id: sdk
        name: Android SDK paths
        run: |
          sdk=${ANDROID_SDK_ROOT:-$ANDROID_HOME}
          {
            echo "ndk=$sdk/ndk/$NDK_VERSION"
            echo "cmake=$sdk/cmake/$SDK_CMAKE_VERSION"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: |
            ${{ steps.sdk.outputs.ndk }}
            ${{ steps.sdk.outputs.cmake }}
          key: android-ndk-${{ env.NDK_VERSION }}-cmake-${{ env.SDK_CMAKE_VERSION }}
      - uses: actions/cache@v6
        with:
          path: ~/.cache/brulion-qt/${{ env.QT_VERSION }}/gcc_64
          key: qt-${{ env.QT_VERSION }}-linux_gcc_64-aqt${{ env.AQT_VERSION }}
      - uses: actions/cache@v6
        with:
          path: ~/.cache/brulion-qt/${{ env.QT_VERSION }}/android_x86_64
          key: qt-${{ env.QT_VERSION }}-android_x86_64-aqt${{ env.AQT_VERSION }}
      - uses: gradle/actions/setup-gradle@v6
      - name: Build the x86_64 app and the bridge self-test
        env:
          ANDROID_NDK_ROOT: ${{ steps.sdk.outputs.ndk }}
          BRULION_ANDROID_ABIS: x86_64
          BRULION_ANDROID_SELFTEST: 1
          BRULION_WERROR: 'ON'
        run: bash scripts/android-build.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: The emulator test (app + bridge self-test)
        env:
          BRULION_EMULATOR_OUT: ${{ runner.temp }}/emu
        run: |
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          scripts/android-emulator-test.sh
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: drawbg-emulator
          path: ${{ runner.temp }}/emu/
          if-no-files-found: ignore
          retention-days: 7
