name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  web:
    name: Web (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev build-essential pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      # tauri::generate_context!() embeds frontendDist (../dist); the real frontend is not needed.
      - name: Placeholder frontend
        run: mkdir -p ../dist && echo '<!doctype html><title>Brulion</title>' > ../dist/index.html
      - run: cargo fmt --all --check
      # --workspace: the app and the brulion-android plugin (its Rust <-> Kotlin <-> docs
      # contract tests included).
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace

  rust-android:
    name: Rust (clippy, Android target)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: src-tauri
    env:
      # What `tauri android build` would export for the app's build scripts.
      TAURI_ANDROID_PACKAGE_NAME_PREFIX: io_github_januszbit
      TAURI_ANDROID_PACKAGE_NAME_APP_NAME: brulion
      WRY_ANDROID_PACKAGE: io.github.januszbit.brulion
      WRY_ANDROID_LIBRARY: brulion_lib
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Use the preinstalled NDK
        run: |
          ndk=${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}
          bin=$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin
          test -x "$bin/aarch64-linux-android24-clang"
          {
            echo "CC_aarch64_linux_android=$bin/aarch64-linux-android24-clang"
            echo "CXX_aarch64_linux_android=$bin/aarch64-linux-android24-clang++"
            echo "AR_aarch64_linux_android=$bin/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$bin/aarch64-linux-android24-clang"
          } >> "$GITHUB_ENV"
      - name: Placeholder frontend
        run: mkdir -p ../dist && echo '<!doctype html><title>Brulion</title>' > ../dist/index.html
      - run: cargo clippy --locked --workspace --target aarch64-linux-android -- -D warnings

  scripts:
    name: Scripts and workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck scripts/*.sh
      - name: android-signing.py unit tests
        run: python3 -m unittest discover -s scripts/tests -v
      - name: actionlint
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

  nix:
    name: Nix flake
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
        with:
          determinate: false
      # First, so that a lock file change without nix/npm-deps.nix fails fast with a clear
      # message instead of a "hash mismatch in fixed-output derivation" deep in the build.
      # Exit codes of the script: 1 = hash out of date, 2 = it could not check.
      - name: Check the npm hash in nix/npm-deps.nix
        run: |
          status=0
          scripts/update-nix-hashes.sh --check || status=$?
          if [ "$status" -eq 1 ]; then
            echo "::error file=nix/npm-deps.nix,title=nix/npm-deps.nix is out of date::package-lock.json changed but the npm dependency hash in nix/npm-deps.nix did not. Run scripts/update-nix-hashes.sh (needs Nix) and commit nix/npm-deps.nix together with package-lock.json. Dependabot PRs get this commit automatically from the 'Nix hash' workflow (nix-hash.yml); any branch can get it from Actions -> Nix hash -> Run workflow."
          fi
          exit "$status"
      - run: nix flake check -L
      - run: nix build .#brulion -L
      - run: nix build .#brulion-web -L
