# Checks, run by hand (Actions -> CI -> Run workflow, or `gh workflow run ci.yml --ref <branch>`),
# for a push to main with "[ci]" in one of its commit messages, and for every release:
# release.yml calls this workflow and publishes the release only when it passes. A push to main
# without the marker runs nothing (its run shows up with every job skipped):
#  * nix     — `nix flake check` + `nix build .#brulion` (builds the package; tests run in linux) on
#              x86_64 and aarch64 (the Raspberry Pi / NixOS targets);
#  * linux   — plain CMake build with Qt 6.11.2 from aqt, -Werror, AddressSanitizer +
#              UndefinedBehaviorSanitizer at -O1 (asserts on), ccache kept between runs, ctest
#              with the GUI tests side by side (fast feedback, independent of nixpkgs); Qt PDF
#              (aqt's `qtpdf`) for drawings' PDF backdrops; a drawing's SVG light and dark in Chrome
#              (tests/app/drawing/svg-theme-check.mjs);
#  * lint    — actionlint + shellcheck (workflows, scripts), no QML read made only for a binding's
#              dependency (scripts/check-qml-reads.sh) and clang-format on the changed lines
#              (.clang-format; tools from the flake's nixpkgs, the same as `nix develop`);
#  * perf    — non-blocking performance smoke: `scripts/perf-check.sh -s` (how running time
#              scales with input size, and the index's memory; no absolute timings, so shared
#              runners are fine — docs/PERFORMANCE.md). A failure warns, it never fails the run.
# Android (android.yml) and the browser build (wasm.yml) have their own workflows.
name: CI

on:
  # Every job has the same `if`: a push runs only with "[ci]" in a pushed commit's message.
  # Under workflow_call the event is the caller's (release.yml: the push of a tag, or by hand).
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# As in android.yml: github.workflow is the caller's name ("Release") under workflow_call, so a
# run by hand never cancels the tests of a release. The event is part of the group: a push
# without "[ci]" (its jobs skipped) must not cancel a run started by hand moments before.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

env:
  QT_VERSION: 6.11.2

jobs:
  nix:
    name: Nix (${{ matrix.system }})
    if: github.event_name != 'push' || github.ref_type == 'tag' || contains(join(github.event.commits.*.message, ' '), '[ci]')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v23

      # checks.x86_64-linux.web-vm is a NixOS VM test and needs KVM, which not every runner
      # has (e.g. some private-repository runners): without /dev/kvm every other check is
      # built and the VM test is skipped with a warning.
      - name: nix flake check
        env:
          SYSTEM: ${{ matrix.system }}
        run: |
          if [ -e /dev/kvm ] || [ "$SYSTEM" != x86_64-linux ]; then
            nix flake check -L
          else
            echo "::warning title=web-vm skipped::no /dev/kvm on this runner: the NixOS VM test checks.$SYSTEM.web-vm was not run"
            nix flake check -L --no-build
            for check in $(nix eval --json ".#checks.$SYSTEM" --apply builtins.attrNames | jq -r '.[]'); do
              if [ "$check" != web-vm ]; then
                nix build -L --no-link ".#checks.$SYSTEM.$check"
              fi
            done
          fi

      - name: nix build .#brulion
        run: nix build .#brulion -L --print-out-paths

  linux:
    name: Linux (Qt 6.11.2 from aqt, GCC, -Werror, sanitizers)
    if: github.event_name != 'push' || github.ref_type == 'tag' || contains(join(github.event.commits.*.message, ' '), '[ci]')
    runs-on: ubuntu-24.04
    # Warm cache: ~20 min; a cold one (new compiler, Qt or flags): ~30 min.
    timeout-minutes: 60
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 1500M
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@v7

      # Qt PDF (`qtpdf`, an extension of Qt's repository): the PDF pages of drawings' backdrops
      # (src/platform/pdfpages_qtpdf.cpp; tests/platform/tst_pdfpages under the sanitizers).
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtpdf
          aqtversion: ==3.3.0
          cache: true

      - name: Install ccache
        run: command -v ccache || { sudo apt-get update -qq && sudo apt-get install -y -qq ccache; }

      # The newest cache of an earlier run (a tag's run sees main's caches); saved again right
      # after the build, so a failing test does not lose it.
      - name: Restore the compiler cache
        uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ccache-asan-O1-${{ env.QT_VERSION }}-${{ github.sha }}
          restore-keys: ccache-asan-O1-${{ env.QT_VERSION }}-

      # -O1 (what the sanitizers recommend) roughly halves the CPU-bound tests' time against
      # -O0; Debug keeps Q_ASSERT on, -g1 the line tables the sanitizers' reports need.
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DBRULION_WERROR=ON
          "-DCMAKE_CXX_FLAGS_DEBUG=-g1 -O1"
          "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer -fno-optimize-sibling-calls"
          "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"

      - name: Build
        id: build
        run: |
          ccache -z
          cmake --build build --parallel
          ccache -s

      - name: Save the compiler cache
        if: ${{ !cancelled() && steps.build.outcome != 'skipped' }}
        uses: actions/cache/save@v6
        with:
          path: .ccache
          key: ccache-asan-O1-${{ env.QT_VERSION }}-${{ github.sha }}

      - name: Unit tests (ctest)
        env:
          # Leak checking off: Qt keeps global singletons alive until exit.
          ASAN_OPTIONS: detect_leaks=0:strict_string_checks=1:detect_stack_use_after_return=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: >-
          ctest --test-dir build --output-on-failure --parallel "$(nproc)" --timeout 300
          --output-junit "$RUNNER_TEMP/ctest-junit.xml"

      # A drawing on "Jak motyw" shows dark in a browser that prefers dark: its SVG's @media style
      # sheet (tests/data/drawing/auto_theme.svg, which tst_drawing compares byte for byte), in
      # Chrome (preinstalled on the runner) with the colour scheme emulated light and dark.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: A drawing's SVG in the browser, light and dark
        run: |
          export CHROME
          CHROME=$(command -v google-chrome)
          node tests/app/drawing/svg-theme-check.mjs

      # Every test's time (and the output of the failed ones) for comparing runs.
      - name: Upload the test times
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ctest-junit-linux-asan
          path: ${{ runner.temp }}/ctest-junit.xml
          if-no-files-found: ignore

      # qmllint over the app's QML modules; advisory (warnings show up as annotations).
      - name: QML lint
        continue-on-error: true
        run: |
          if cmake --build build --target help | grep -q '^all_qmllint'; then
            cmake --build build --target all_qmllint
          else
            echo "no all_qmllint target"
          fi

  lint:
    name: Lint (actionlint, shellcheck, clang-format)
    if: github.event_name != 'push' || github.ref_type == 'tag' || contains(join(github.event.commits.*.message, ' '), '[ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@v23

      - name: Tools from the flake's nixpkgs (the versions `nix develop` has)
        run: |
          for path in $(nix build --no-link --print-out-paths --inputs-from . \
            nixpkgs#actionlint nixpkgs#shellcheck nixpkgs#clang-tools); do
            if [ -d "$path/bin" ]; then echo "$path/bin" >> "$GITHUB_PATH"; fi
          done

      # actionlint also runs shellcheck on every `run:` script.
      - name: actionlint
        run: actionlint -color

      - name: shellcheck scripts/*.sh tests/scripts/*.sh
        run: shellcheck scripts/*.sh tests/scripts/*.sh

      # A binding follows what it reads for real: qmlcachegen compiles a bare `void x` read away,
      # and the binding's dependency with it (docs/UI.md; also ctest tst_scripts_check_qml_reads).
      - name: QML reads made only for a dependency (scripts/check-qml-reads.sh)
        run: scripts/check-qml-reads.sh

      # Only the changed lines (the existing code is not reformatted wholesale): those of the
      # pushed commits, by hand those since the last release, for a release those since the one
      # before. A difference only warns.
      - name: clang-format (changed lines)
        env:
          BASE: ${{ github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ] ||
            ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            # release is main's commit of the last release (docs/RELEASE.md).
            BASE=$(git merge-base HEAD origin/release 2>/dev/null || true)
            if [ -z "$BASE" ] || [ "$BASE" = "$(git rev-parse HEAD)" ]; then
              # HEAD is a release: the one before is the newest tag that does not contain HEAD
              # (v0.3.6 and v0.3.7 sit on merges of main: their merge base is main's commit).
              prev=$(git -c versionsort.suffix=- for-each-ref --count=1 --sort=-v:refname \
                --no-contains HEAD --format='%(refname)' 'refs/tags/v[0-9]*')
              BASE=''
              if [ -n "$prev" ]; then BASE=$(git merge-base HEAD "$prev" || true); fi
            fi
            if [ -z "$BASE" ]; then
              BASE=$(git rev-parse -q --verify HEAD~1 || true)
            fi
          fi
          if [ -z "$BASE" ]; then
            echo "Nothing to compare with."
            exit 0
          fi
          echo "Checking the lines changed in $BASE..HEAD"
          status=0
          git clang-format --diff --extensions c,cc,cpp,cxx,h,hh,hpp,hxx "$BASE" HEAD > "$RUNNER_TEMP/format.diff" || status=$?
          cat "$RUNNER_TEMP/format.diff"
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          files=$(sed -n 's#^+++ b/##p' "$RUNNER_TEMP/format.diff" | sort -u)
          for f in $files; do
            echo "::warning file=$f,title=clang-format::$f is not formatted as in .clang-format; run: git clang-format $BASE"
          done
          {
            echo '### clang-format'
            echo
            echo "Run \`git clang-format $BASE\` inside \`nix develop\` and commit the result:"
            echo
            echo '```diff'
            cat "$RUNNER_TEMP/format.diff"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  perf:
    name: Performance smoke (scaling + memory, non-blocking)
    if: github.event_name != 'push' || github.ref_type == 'tag' || contains(join(github.event.commits.*.message, ' '), '[ci]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # A regression warns (annotation + job summary) but never blocks a merge: shared runners are
    # noisy, so only machine-independent checks run here (docs/PERFORMANCE.md, "Regression guards").
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          aqtversion: ==3.3.0
          cache: true

      - name: Build the benchmark suites (Release)
        run: |
          cmake -S . -B build-bench -G Ninja -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DCMAKE_BUILD_TYPE=Release -DBRULION_BUILD_BENCHMARKS=ON
          cmake --build build-bench --parallel --target bench_text bench_index bench_markdown bench_io

      - name: scripts/perf-check.sh -s
        run: |
          status=0
          scripts/perf-check.sh -n -s -b build-bench -o "$RUNNER_TEMP/perf" -- -r 3 \
            > "$RUNNER_TEMP/perf.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/perf.log"
          {
            echo '### Performance smoke: scripts/perf-check.sh -s'
            echo
            echo '```'
            grep -E '^(ok|FAIL|MISSING) |^perf-check:' "$RUNNER_TEMP/perf.log" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            grep -E '^(FAIL|MISSING) ' "$RUNNER_TEMP/perf.log" | while read -r line; do
              echo "::warning title=performance regression?::$line"
            done
          fi
          exit "$status"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: perf-smoke
          path: ${{ runner.temp }}/perf
          retention-days: 14
