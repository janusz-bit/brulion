# Keeps nix/npm-deps.nix in step with package-lock.json on Dependabot's npm pull requests.
#
# The Nix packages fetch the npm dependencies as one fixed-output derivation whose hash covers
# the whole lock file, so every Dependabot npm update breaks `nix build` (and CI's "Nix flake"
# job) until scripts/update-nix-hashes.sh is run. This workflow runs it on the PR branch and
# pushes the result as one extra commit. Run it by hand (Actions -> Nix hash -> Run workflow)
# on any other branch that needs the same fix.
#
# A push made with the default GITHUB_TOKEN does not start any workflow, so the new commit
# would get no CI at all. Re-running the PR's old CI run does not help either: a re-run tests
# the commit of the original event, i.e. the one with the stale hash. workflow_dispatch is the
# exception to that rule, so after pushing, this workflow starts CI (ci.yml) on the branch;
# its checks are reported on the new head commit and show up in the PR. If they don't (e.g.
# the dispatch failed), run CI by hand: Actions -> CI -> Run workflow -> the PR branch (don't
# close the PR: Dependabot takes that as "ignore this version").
#
# Dependabot and the extra commit: with a commit it didn't make on the branch, Dependabot may
# stop rebasing the PR by itself (it says the PR was edited by someone else) and then also
# refuses `@dependabot rebase`. Comment `@dependabot recreate`: the force push drops the commit
# and the resulting `synchronize` event runs this workflow again, which adds it back.
name: Nix hash

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-hash-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  update:
    name: Update nix/npm-deps.nix
    # Only Dependabot's own PRs from this repository (a fork PR never gets a writable token
    # anyway). A human pushing to a Dependabot branch is expected to run the script locally.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.actor == 'dependabot[bot]' &&
       github.event.pull_request.user.login == 'dependabot[bot]' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Push the hash commit to the PR branch. Dependabot runs get a read-only token unless
      # the workflow asks for more, which it can for PRs from the same repository.
      contents: write
      # `gh workflow run ci.yml` (see the header).
      actions: write
    env:
      BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Check the ref
        if: github.event_name == 'workflow_dispatch' && github.ref_type != 'branch'
        run: |
          echo "::error::Run this workflow on a branch (it pushes a commit to it), not on the $GITHUB_REF_TYPE $GITHUB_REF_NAME"
          exit 1

      # The exact commit of the event: if the branch moves on meanwhile, the push below is
      # rejected (no force push) and the newer commit's own run takes over.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # The token is only handed to the push and dispatch steps below, not left in .git
          # (or the environment) while the script runs.
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@v23
        with:
          determinate: false

      # prefetch-npm-deps only downloads the tarballs listed in package-lock.json; no package
      # code (install scripts) runs here.
      - name: Recompute the npm dependency hash
        run: scripts/update-nix-hashes.sh

      - id: commit
        name: Commit nix/npm-deps.nix
        run: |
          if git diff --quiet -- nix/npm-deps.nix; then
            echo "nix/npm-deps.nix is already up to date, nothing to push."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nix/npm-deps.nix
          git commit -m 'Update the npm dependency hash in nix/npm-deps.nix' \
            -m 'Generated by scripts/update-nix-hashes.sh (.github/workflows/nix-hash.yml).'
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Push to ${{ env.BRANCH }}
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push "https://x-access-token:${GH_TOKEN}@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/$BRANCH"

      # The push above starts no workflow (GITHUB_TOKEN); a workflow_dispatch does.
      - name: Start CI on the new commit
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow run ci.yml --ref "$BRANCH"
          {
            echo "### nix/npm-deps.nix updated on \`$BRANCH\`"
            echo
            echo "Pushed $(git rev-parse --short HEAD) and started [CI]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/ci.yml) on it"
            echo "(pushes made with GITHUB_TOKEN start no workflow by themselves)."
            echo "If its checks don't show up in the PR, run CI by hand (Actions -> CI -> Run workflow"
            echo "on \`$BRANCH\`); re-running an older run tests the old commit, not this one."
          } >> "$GITHUB_STEP_SUMMARY"
