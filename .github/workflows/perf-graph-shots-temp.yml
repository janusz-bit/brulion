# TEMPORARY (s2/perf-graph): the graph's scene graph on OpenGL (Xvfb + Mesa llvmpipe) — the
# pixel test of tst_planning_graph_sg and screenshots of the graph views, software renderer and
# OpenGL side by side. Runs on a push of this file; removed again before the merge.
name: TEMPORARY graph OpenGL check

on:
  push:
    branches: [s2/perf-graph]
    paths: [.github/workflows/perf-graph-shots-temp.yml]

permissions:
  contents: read

jobs:
  shots:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.11.2
          host: linux
          target: desktop
          arch: linux_gcc_64
          aqtversion: ==3.3.0
          cache: true

      - name: X server, Mesa and xcb libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build xvfb libgl1-mesa-dri libglx-mesa0 libegl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 fonts-dejavu-core

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          cmake --build build --parallel --target brulion tst_planning_graph tst_planning_graph_sg

      - name: Graph tests (offscreen, the null backend and the software renderer)
        run: ctest --test-dir build --output-on-failure -R 'tst_planning_graph'

      - name: The scene graph on OpenGL vs the QPainter path
        run: |
          QSG_INFO=1 xvfb-run -a -s "-screen 0 1920x1200x24" env QT_QPA_PLATFORM=xcb BRULION_GRAPH_SG_API=opengl \
            build/tests/app/planning/tst_planning_graph_sg

      - name: Screenshots, software and OpenGL
        if: always()
        run: |
          export BRULION_BIN=build/src/app/brulion OUT_DIR=shots
          tests/app/planning/screenshots.sh graph graph-selected graph-local graph-big
          xvfb-run -a -s "-screen 0 1920x1200x24" env PLATFORM=xvfb tests/app/planning/screenshots.sh graph graph-selected graph-local graph-big

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: graph-shots
          path: shots
          retention-days: 14
