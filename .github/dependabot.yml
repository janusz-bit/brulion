# Monthly, grouped dependency updates.
# Tauri: the npm packages (@tauri-apps/*) and the Rust crates (tauri*) must stay on the same
# major.minor (the Tauri CLI refuses mismatched versions), so merge the two "tauri" PRs together.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      tauri:
        patterns: ['@tauri-apps/*']
      npm-minor-patch:
        update-types: [minor, patch]
      npm-major:
        update-types: [major]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      tauri:
        patterns: ['tauri', 'tauri-*']
      cargo-minor-patch:
        update-types: [minor, patch]
      cargo-major:
        update-types: [major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ['*']
