<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 500" width="1024" height="500">
  <!--
    Google Play's feature graphic (1024 × 500, no alpha): scripts/play-feature-graphic.sh renders it
    into fastlane/metadata/android/<locale>/images/featureGraphic.png for each locale, with the
    locale's tagline in place of @LINE1@ and @LINE2@, logo.svg (assets/logo.svg) copied next to it
    and the fonts of assets/fonts/ui only (docs/GOOGLE_PLAY.md "Store listing"). The colours are the
    logo's: its background, the sheet's paper and grid, the margin's red. Play may lay a play button
    over the middle when the listing has a video: nothing important there.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34405a"/>
      <stop offset="1" stop-color="#1c2130"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse" x="0" y="8">
      <path d="M44 0H0V44" fill="none" stroke="#9fc3e6" stroke-width="1.5" opacity="0.10"/>
    </pattern>
  </defs>
  <rect width="1024" height="500" fill="url(#bg)"/>
  <rect width="1024" height="500" fill="url(#grid)"/>
  <image x="92" y="100" width="300" height="300" xlink:href="logo.svg" href="logo.svg"/>
  <rect x="446" y="268" width="64" height="6" rx="3" fill="#e2574c"/>
  <text x="440" y="236" fill="#fbf7ee" font-family="Brulion Inter" font-weight="700" font-size="112"
    letter-spacing="-2">Brulion</text>
  <text fill="#c9dbee" font-family="Brulion Inter" font-weight="500" font-size="36">
    <tspan x="446" y="328">@LINE1@</tspan>
    <tspan x="446" y="374">@LINE2@</tspan>
  </text>
</svg>
